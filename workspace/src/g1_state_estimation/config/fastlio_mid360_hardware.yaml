# FAST-LIO2 on the G1's Livox Mid360. HARDWARE. The simulator uses fastlio_mid360_sim.yaml,
# which carries the same extrinsic, modelling an IMU inside the sensor too, and differs only
# in scan density, voxel size and whether the extrinsic is estimated online. See that file.
#
# Derived from deepglint/FAST_LIO_LOCALIZATION_HUMANOID's mid360.yaml (humble branch), which is
# the same sensor on the same robot. Their open3d_loc relocalization layer is not used: AMCL
# owns map -> odom here, and open3d_loc is the only thing in that repo that needs Open3D.
/**:
  ros__parameters:
    feature_extract_enable: false
    # Every third point. The Mid360 returns ~20k per 10 Hz scan and the solver does not need
    # all of them; this is upstream's own value for this sensor.
    point_filter_num: 3
    max_iteration: 3
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000.0
    runtime_pos_log_enable: false
    map_file_path: "./test.pcd"

    common:
      # CustomMsg, not the PointCloud2 on /livox/lidar. Only this format carries a per-point
      # timestamp, which is what motion undistortion needs on a sensor that sweeps while the
      # robot walks. g1_livox_pointcloud restates it as PointCloud2 for everyone else.
      lid_topic: "/livox/custom_msg"
      # The Mid360's own IMU, hardware-synchronised with the points it ships beside. The
      # pelvis IMU in LowState would be a second clock to reconcile for no gain.
      imu_topic: "/livox/imu"
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0

    preprocess:
      lidar_type: 1 # Livox serials
      scan_line: 4
      blind: 0.5
      timestamp_unit: 3
      scan_rate: 10

    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 100.0
      extrinsic_est_en: true
      # The LiDAR's pose in the IMU's frame, both inside the sensor housing, a few
      # centimetres apart. It does NOT change with the mount: the Mid360 is bolted to the G1
      # upside down, and its IMU is inverted along with it, so their relative pose is
      # unaffected. The mount itself lives in the URDF (mid360_joint carries roll pi), which
      # is where the rest of the stack already looks for it.
      extrinsic_T: [-0.011, -0.02329, 0.04412]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]

    publish:
      path_en: false
      effect_map_en: false
      map_en: false
      # The registered scan, kept for RViz. The global map and path above are off: they grow
      # without bound and nothing downstream reads them.
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: false

    pcd_save:
      # OFF, and upstream ships it ON. With interval -1 every frame is accumulated in memory
      # and written at shutdown, which on a long run is a slow leak ending in a crash.
      pcd_save_en: false
      interval: -1
