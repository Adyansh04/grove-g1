# odometry:=fast_lio, loaded by fastlio_odometry.launch.py. The only source that runs on the
# robot. An estimate, so it drifts, and map -> odom corrects it.
g1_odometry_publisher:
  ros__parameters:
    odometry_source: "fast_lio"

    odom_frame_id: "odom"
    # Split, as in the ground-truth config.
    base_frame_id: "base_footprint"
    pelvis_frame_id: "pelvis"

    # The frame FAST-LIO reports, offset to the pelvis through TF. That chain crosses the waist
    # joints, so without them in /joint_states this source publishes nothing.
    lidar_body_frame_id: "mid360_imu"

    # Standing pelvis height at the latch, which puts odom on the floor. Re-measure if the stance
    # changes: a few centimetres high lifts floor returns toward the costmap's 0.08 m cut.
    start_height_m: 0.729

    max_tilt_deg: 80.0

    # Slerp fraction per LiDAR sample toward the pelvis IMU's tilt: ~2 s at 10 Hz, slower than
    # the gait and faster than FAST-LIO's drift. Too high injects gait-rate error; 0.0 disables.
    tilt_correction_gain: 0.05

    publish_rate_hz: 50.0
    publish_odom_msg: true

    source_timeout_ms: 500.0
    wall_timeout_ms: 2000.0

    # Placeholders, looser than ground truth's; FAST-LIO's real covariance is uncharacterised.
    pose_covariance: 1.0e-3
    twist_covariance: 1.0e-2
