# odometry:=ground_truth, loaded by g1_bringup's sim.launch.py. Simulation only: MuJoCo's exact
# pelvis state, which the robot has no equivalent of.
g1_odometry_publisher:
  ros__parameters:
    # From g1_sensor_relay's ~/base_state, so it needs sensors:=true.
    odometry_source: "ground_truth"

    odom_frame_id: "odom"
    # Split: Nav2 and slam_toolbox want a gravity-aligned base; pelvis keeps the real attitude.
    base_frame_id: "base_footprint"
    pelvis_frame_id: "pelvis"

    # Past this tilt the heading is held. Untuned: below 90 because conditioning degrades first,
    # and a robot at 80 degrees is falling anyway.
    max_tilt_deg: 80.0

    # No start_height_m: this source carries the real height.

    publish_rate_hz: 50.0
    publish_odom_msg: true

    source_timeout_ms: 200.0
    wall_timeout_ms: 2000.0

    # Exact state, but an all-zero covariance is a known Nav2 pitfall.
    pose_covariance: 1.0e-6
    twist_covariance: 1.0e-6
