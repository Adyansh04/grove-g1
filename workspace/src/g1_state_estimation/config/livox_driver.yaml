# The Mid360 driver, hardware only. user_config_path is filled in by the launch file, which
# is the only place that can resolve this package's share directory.
livox_lidar_publisher:
  ros__parameters:
    # CustomMsg: FAST-LIO needs the per-point timestamps. g1_livox_pointcloud covers
    # everyone who wants PointCloud2.
    xfer_format: 1
    multi_topic: 0
    data_src: 0
    output_data_type: 0
    publish_freq: 10.0
    # What the URDF calls the sensor, and what the sim publishes.
    frame_id: "mid360_link"
