# The Mid360 driver, hardware only. The launch file sets user_config_path.
livox_lidar_publisher:
  ros__parameters:
    # CustomMsg for FAST-LIO; g1_livox_pointcloud republishes it as PointCloud2.
    xfer_format: 1
    multi_topic: 0
    data_src: 0
    output_data_type: 0
    publish_freq: 10.0
    # What the URDF calls the sensor, and what the sim publishes.
    frame_id: "mid360_link"
