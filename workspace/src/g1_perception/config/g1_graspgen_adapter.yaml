# The grasp-generator client, loaded by g1_perception/launch/perception.launch.py with
# grasp_engine:=graspgen.
g1_graspgen_adapter:
  ros__parameters:
    # GraspGenX runs on the host, for the same reason the vision server does. Its own default
    # port is 5556; compose is host-networked, so localhost reaches it.
    server_address: "tcp://127.0.0.1:5556"

    # One request per pick attempt, and the model runs eager fp32 unless the server was started
    # with TensorRT, so this is generous rather than tight.
    zmq_timeout_ms: 30000

    # The Dex3-1's sweep volume: two boxes in the gripper's own frame, in metres, enclosing the
    # finger volume open and half closed, as extents then offset for each. Copied from
    # GraspGenX's own `unitree_g1` gripper description, which is this hand: seven joints named
    # right_zero through right_six, of type revolute_3f.
    #
    # These twelve numbers are the entire description of the hand the model gets, which is why a
    # gripper it has never seen works at all.
    sweep_volume: [0.10, 0.06, 0.04, 0.0, 0.0, 0.07, 0.04, 0.06, 0.04, 0.007, 0.0, 0.06]
    # 0 parallel two-finger, 1 revolute two-finger, 2 revolute three-finger.
    gripper_type: 2
    # Gripper base to fingertips along the approach axis, from the same description.
    fingertip_depth_m: 0.07

    # Right only. The description above is the right hand, and mirroring a sweep volume does not
    # describe the left one: a request for the left hand is refused rather than answered wrongly.
    hand: "right"

    # How many the model draws, and how many of the best come back. Everything it generates is
    # returned with a score and thresholded on this side, so the cap is about message size and
    # the work the caller does per candidate, not about quality.
    num_grasps_sampled: 200
    max_grasps: 100

    # Instances with fewer points than this are skipped by the server rather than guessed at.
    min_object_points: 100
