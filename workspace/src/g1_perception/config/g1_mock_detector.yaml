# The stand-in detector, loaded by g1_perception/launch/perception.launch.py with detector:=mock.
#
# SIMULATION ONLY: it cuts masks from the simulator's object poses, which the robot does not have.
g1_mock_detector:
  ros__parameters:
    # `phrases` is a launch argument, not a key here: it feeds the real detector too.

    # Zero for a stand-in with nothing to compute. Raise to 1.5 to face the real detector's delay,
    # which every stamp and staleness window downstream has to survive; the depth window follows.
    mock_latency_s: 0.0
    # The camera publishes at 10 Hz; the real detector manages about 0.7.
    mock_rate_hz: 10.0

    # How far past its own box a pixel may sit and still count. Zero returns an almost empty mask
    # on a flat face; well past a few millimetres it is a deliberately sloppy segmenter.
    mock_margin_m: 0.005

    # Smaller than this in the image is reported unseen. Roughly a 7 mm object at half a metre.
    min_pixels: 50
