# The detector client, loaded by g1_perception/launch/perception.launch.py with
# detector:=vision.
g1_detector:
  ros__parameters:
    # The vision server runs on the host, outside this container, because it needs torch and
    # CUDA. Compose is host-networked, so localhost reaches it. Start it with
    # scripts/vision_server.py; scripts/setup-vision.sh installs it.
    server_address: "tcp://127.0.0.1:5560"

    # Grounded-SAM-2 takes about 1.5 s per frame on the laptop GPU and SAM 3 is slower on a
    # Jetson. The timeout is what a stalled server costs before the node complains and rebuilds
    # its socket, so it sits well past the slowest sensible inference rather than near it.
    zmq_timeout_ms: 20000

    # One request at a time regardless, since the call blocks: this only decides how soon after
    # an answer the next question is asked. The models cannot beat about 0.7 Hz anyway.
    detect_rate_hz: 1.0

    # `phrases` is a launch argument, not a key here. Empty means idle, and `ros2 param set` is
    # how a tree or the instruction grounder changes it while the node runs.

    # Asking about a frame older than this wastes a second and a half of GPU on a scene that has
    # moved. The camera publishes at 10 Hz, so anything past a second means it has stopped.
    #
    # 2.5, not 1.0, because in simulation the camera and the detector share one GPU. Measured with
    # the vision server loaded: MuJoCo's offscreen render goes from 7.2 to 13.4 ms a frame and the
    # newest frame reaching the detector is 1.4 to 1.9 s old, so a 1.0 s gate refused every frame
    # and /objects stayed empty for the whole run. It reads as a dead camera and is not one. The
    # scenes this runs on are static, so acting on a 2 s old view of them costs nothing; a moving
    # scene on hardware, with its own camera, wants the tighter number back.
    max_image_age_s: 2.5

    # Grounding DINO scores every object against every phrase, so this is what decides how many
    # of the also-rans become tracks of their own. Measured over 25 tabletop frames: the right
    # object never scored below 0.62 and the best wrong one never above 0.43, and a phrase
    # carrying two tracks loses the bare-phrase alias the skills resolve objects by. 0.50 sits in
    # that gap. Raise the wording before raising this: a longer phrase widens the same gap from
    # 0.25 to 0.55 without costing a detection.
    # SAM 3 ignores the second: it has one calibrated score.
    box_threshold: 0.50
    text_threshold: 0.25
