# The detector client, loaded by g1_perception/launch/perception.launch.py with detector:=vision.
g1_detector:
  ros__parameters:
    # canopy's semantic server runs on the host, since it needs torch and CUDA; compose is
    # host-networked. Start it with SAM 3.1: ./scripts/serve.sh canopy --detector sam3.1. 5560 is
    # the vision server (./scripts/serve.sh vision), which keeps Grounded SAM 2 as the alternative.
    server_address: "tcp://127.0.0.1:5561"

    # Well past the slowest inference: this is what a stalled server costs before the node
    # rebuilds its socket.
    zmq_timeout_ms: 20000

    # How soon after an answer the next question is asked; the call itself blocks.
    detect_rate_hz: 1.0

    # `phrases` is a launch argument; empty means idle, and trees change it with ros2 param set.

    # Frames older than this are not asked about. 2.5 s because in simulation the camera and the
    # detector share one GPU and frames arrive 1.4 to 1.9 s old; a moving scene wants less.
    max_image_age_s: 2.5

    # SAM 3.1's score is its match times the phrase's presence: on the simulator's close-ups of mugs,
    # bowls and trays, 0.40 was the lowest that named nothing else (recall 0.83). Grounded SAM 2
    # also reads text_threshold.
    box_threshold: 0.40
    text_threshold: 0.25
