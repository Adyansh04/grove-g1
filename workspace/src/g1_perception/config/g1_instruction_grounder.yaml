# The instruction grounder, loaded by g1_perception/launch/perception.launch.py with
# grounding:=true.
g1_instruction_grounder:
  ros__parameters:
    # The same host server the detector talks to, started with --vlm so it can answer `ground`.
    # Without that flag the endpoint says so rather than guessing.
    server_address: "tcp://127.0.0.1:5560"

    # A vision-language model answers in tokens, and a couple of hundred of them take seconds on
    # this card. This is what a stalled one costs before the caller is told.
    zmq_timeout_ms: 30000

    # More than a handful of phrases is the model describing the room rather than answering the
    # instruction, and each one costs the detector a decoder pass per frame.
    max_phrases: 6

    # Grounding a scene the robot has since left is worse than refusing: the phrases would name
    # objects that are no longer in front of it.
    max_image_age_s: 2.0

    # Write the phrases straight onto the detector. Off makes this a question rather than an
    # instruction, which is what a caller wants when it is choosing between several answers.
    apply_phrases: true
    detector_node: "/g1_detector"
