# How often each object label appears in each room type, P(present | type), for the naive Bayes
# room typer. Labels a type does not list get `unlisted`. Keys are the detector vocabulary's words
# (workspace/src/g1_perception/config/indoor_vocabulary.yaml); `synonyms` maps other detectors'
# and people's words onto them, for typing and for finding objects by name.
unlisted: 0.08

room_types:
  kitchen:
    prior: 0.15
    objects: { refrigerator: 0.9, countertop: 0.8, sink: 0.8, oven: 0.8, stove: 0.8,
               microwave: 0.7, dishwasher: 0.6, kettle: 0.5, "dining table": 0.3, chair: 0.4,
               "trash can": 0.5, cabinet: 0.5, bowl: 0.5, mug: 0.4, bottle: 0.4 }
  living room:
    prior: 0.2
    objects: { sofa: 0.9, armchair: 0.7, "coffee table": 0.8, television: 0.7, shelf: 0.4,
               "potted plant": 0.5, lamp: 0.5, rug: 0.5, pillow: 0.6 }
  dining room:
    prior: 0.1
    objects: { "dining table": 0.9, chair: 0.8, cabinet: 0.3, bowl: 0.3, "potted plant": 0.3 }
  bedroom:
    prior: 0.2
    objects: { bed: 0.95, nightstand: 0.7, wardrobe: 0.6, dresser: 0.5, lamp: 0.4, pillow: 0.6 }
  office:
    prior: 0.15
    objects: { desk: 0.9, chair: 0.5, monitor: 0.7, "desktop computer": 0.6, laptop: 0.6,
               keyboard: 0.6, shelf: 0.5, printer: 0.4, "trash can": 0.4, box: 0.2 }
  bathroom:
    prior: 0.1
    objects: { toilet: 0.95, sink: 0.7, bathtub: 0.8, shower: 0.8, mirror: 0.5, towel: 0.6 }
  storage room:
    prior: 0.1
    objects: { box: 0.8, shelf: 0.7, cabinet: 0.4, bucket: 0.4 }

synonyms:
  refrigerator: [fridge]
  countertop: [counter, kitchen counter]
  "trash can": [dustbin, "waste bin", wastebasket, "garbage can", bin]
  sofa: [couch]
  television: [tv]
  shelf: [bookshelf, bookcase]
  box: ["cardboard box", crate, "storage box"]
  pillow: [cushion]
  "desktop computer": [computer, pc]
  dresser: ["drawer cabinet", "chest of drawers"]
  chair: ["office chair", "dining chair"]
