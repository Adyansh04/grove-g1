# The world model: rooms, camera coverage and objects over the SLAM map. Loaded by
# launch/world_model.launch.py; every value here has the same default in the node.
g1_world_model:
  ros__parameters:
    map_frame: "map"
    base_frame: "base_footprint"

    # Empty keeps the world in memory only. The launch file points this next to the map.
    world_dir: ""
    autosave_period_s: 60.0

    # Frames count only after the base has been still this long: the relay stamps images on
    # arrival, so a frame taken mid-turn would land degrees off.
    require_stillness: true
    still_linear: 0.05
    still_angular: 0.05
    settle_s: 1.0
    # Depth is integrated this long after its stamp, once AMCL's map -> odom has caught up.
    tf_wait_s: 0.2
    frame_history_s: 6.0

    # The cameras read. Camera N reads <prefix>depth/image_raw, <prefix>depth/camera_info,
    # <prefix>color/image_raw and <prefix>instance_masks, prefix camera.N.prefix ("N/" unset);
    # world_model.launch.py wires each to its driver's topics. Height, pitch and heading come from
    # TF and camera_info, so cameras are added, moved or dropped here and in the launch alone.
    # camera.N.coverage: false keeps a camera for objects and room views only.
    cameras: ["head"]
    resegment_period_s: 5.0

    coverage:
      min_range: 0.2
      good_range: 2.0
      max_range: 4.0
      # Quality at which a target counts as seen well enough.
      well_seen: 0.35
      pixel_stride: 4
      floor_incidence_limit: 1.40
      face_incidence_limit: 1.31
      surface_incidence_limit: 1.48

    planner:
      # Nav2's footprint radius; standing poses keep this plus the margin from obstacles. The margin
      # is wide because Nav2 stops up to 0.5 m short, and a stop beside a low coffee table the
      # LiDAR barely sees left the robot where Nav2 could plan nothing. At 0.15 (run 30) the robot
      # wedged by the living room's armchair within 11 minutes, StepClear or not.
      robot_radius: 0.45
      clearance_margin: 0.25
      # Frontier goals stand wider: a 2 m shadow drew the robot into a pocket with 0.75 m of
      # clearance among an armchair, a plant and a cabinet, and Nav2 never got it out.
      frontier_clearance: 0.35
      # Paths keep one map cell more than the radius, as Nav2's inflation does.
      travel_margin: 0.05
      candidate_spacing: 0.40
      max_headings: 3
      min_heading_gain: 20.0
      min_viewpoint_gain: 40.0
      # The pass ends once the best viewpoint pays less than this, weighted targets per second,
      # and every room has these shares of its floor and faces seen; until then only the short
      # rooms' targets count. Runs 26-29 spent 28-45% of their time past the rate for 4% of the
      # gain; run 31, cut on the rate alone, left three rooms' faces at 0.64-0.72.
      min_viewpoint_rate: 2.0
      room_floor_goal: 0.9
      room_face_goal: 0.8
      # Measured on the AGILE gait: Nav2 averages about 0.35 m/s, turning is 1:1 up to 0.84 rad/s.
      travel_speed: 0.35
      turn_speed: 0.8
      # The detector answers about once a second on frames 1.4-1.9 s old.
      dwell_time: 2.5
      goal_overhead: 4.0
      # Walking to another room costs this many times more while this one has work left: at 2
      # the robot left rooms half seen and came back for the rest two or three times.
      room_switch_factor: 3.0
      # Poses scored per request: those with the most unseen work per second of getting there.
      max_candidates: 400
      # The next viewpoint is the first stop of the shortest walk through the few that together
      # see the most, re-planned each time. On the ground-truth replay, greedy order walked 258 m
      # for 28.7 min; a tour of 8 walked 173 m for 25.7 min.
      tour_size: 8
      min_frontier_size: 0.75
      frontier_stand_back: 0.5
      # A frontier worth walking to opens onto this much unknown, m2: the shadow behind a sofa is a
      # pocket, not a way on; the coverage pass still looks there with the camera.
      min_frontier_unknown: 4.0
      # Unknown the robot had in plain view this near a viewpoint it reached, m. Still unknown
      # once the map has caught up, it is shadow the LiDAR cannot reach, like the floor behind an
      # armchair whose wall it never saw; chasing that wedges the robot among the furniture.
      frontier_seen_radius: 1.5
      # The frontier pass ends once this many visits in a row added less known map than this, m2:
      # the rooms are found by then, and the camera pass walking through them fills the corners.
      # Run 20: the first 11 visits mapped 187 of 208 m2 at 8 to 33 m2 each; the 14 after added 0
      # to 4.5 m2 each.
      frontier_stall_visits: 4
      min_frontier_growth: 12.0
      # The frontier pass ignores unknown under min_frontier_unknown, so corners of rooms (the
      # floor behind the bedroom's wardrobe, a notch in a wall) were never scanned and their
      # walls never closed. After the camera pass, which maps most of them on its way, the robot
      # looks into the unknown pockets this big left inside the building, from within the range,
      # m2 / m.
      pocket_min_area: 0.1
      pocket_look_range: 3.0
      # Pocket edge a look must see that no other look does, m: on run 40's map, looks at less
      # were walks of up to 50 s for strips the floor plan closes anyway.
      pocket_min_edge: 0.4
      max_attempts: 2
      # Unreached viewpoints in a room the robot has never got into before it stops trying that
      # room, and in a row anywhere before it decides the robot itself is stuck and plans nothing
      # until it has moved.
      max_room_failures: 3
      max_failures_in_a_row: 5

    objects:
      voxel: 0.04
      max_depth: 4.5
      min_score: 0.30
      min_match: 0.55
      # AMCL's map drifts by about this much between visits.
      position_tolerance: 0.35
      stale_after: 4
      remove_after: 10
      # A table seen from two sides fuses into two parts that share no voxels but touch; tables and
      # shelves are also seen as legs and ends, apart, but never joined into anything longer.
      merge_gap: 0.10
      support_merge_gap: 1.0
      max_merged_extent: 3.5
      # Anything real in view is detected in several frames of a dwell; one sighting that no
      # second follows within confirm_s is a fragment cut from something else. Long enough for a
      # later viewpoint in the same room to confirm what one at the edge of view caught once.
      min_observations: 2
      confirm_s: 120.0
      # The camera pass goes back to where something was seen once, as far as this, m, and looks
      # at it again: the TV on its stand shows only a strip at the image's upper edge, and one
      # dwell caught it in a single frame.
      second_look_reach: 3.0
      # Floor objects take the outline the floor plan shows under them. A blob this near a box
      # competes for it; each cell goes to the box it lies deepest in, unless further outside it
      # than fit_max_stretch; an object keeps its share if it comes to between these many times
      # its box's area. Wall-height hits are walls, and so are bands thinner than fit_min_depth.
      fit_reach: 0.15
      fit_max_growth: 3.0
      fit_min_share: 0.25
      fit_max_stretch: 1.0
      fit_min_depth: 0.2
      # Then each side moves to where the object ends: in by the scan's blur where it faces free
      # floor, out to the wall where the wall's band took the object's back. Runs 26-29 boxes were
      # 0.10-0.17 m too big across chairs, sofas and tables, 0.10-0.12 m short across counters.
      fit_edge_bleed: 0.05
      fit_wall_reach: 0.2
      # A box mostly on floor the scan saw free has drifted: run 28's crate spread 2.3 m over the
      # storage room as SLAM moved its map; the map's outline of at least fit_min_adrift_share m2
      # then replaces it. A plant's leaves over free floor are no drift: run 33 swapped a plant
      # for the 9 cells of its pot.
      fit_adrift_free: 0.5
      fit_min_adrift_share: 0.04

    floor_plan:
      # Walls hidden from the LiDAR at every height, behind a wardrobe or a tall shelf, are
      # carried straight on for up to this long in the saved floor plan, m: a wall is a gap with
      # straight solid at least min_wall_run long either side.
      max_wall_gap: 2.5
      min_wall_run: 0.3
      # A free gap in such a wall no wider than this is a crack, closed: grazing beams mark thin
      # walls free in places (run 35's hallway walls came out dashed). Doorways are far wider.
      max_wall_crack: 0.3
      # Any other unseen stretch between two solid cells closes only across one piece of
      # furniture's depth: at 2.5 m it filled the floor behind the bedroom's wardrobe to the wall.
      max_furniture_depth: 1.2

    rooms:
      min_persistence: 0.15
      # A room is somewhere at least 1.6 m across; the pocket behind a sofa is not one.
      min_peak: 0.80
      max_doorway_width: 1.5
      # An opening wider than a door still separates two rooms when it is this narrow against
      # them: the facility's rooms open onto its hub through 2.6 m gaps.
      max_pinch_ratio: 0.7
      min_room_area: 2.0

    # Rooms are segmented on walls alone: cells the LiDAR hits between these heights. Tables, sofas
    # and beds never reach the band, so they stop cutting rooms into pieces.
    structure:
      enabled: true
      min_z: 1.4
      max_z: 2.2
      min_hits: 3
      # Wall returns scatter by AMCL's error; cells this near one are never cleared as furniture.
      dilate: 0.30
      # Rays that must cross the band over a cell, with no return, before it counts as furniture.
      min_clear: 5
      # Fewer wall cells than this and the plain map is segmented instead.
      min_cells: 200

    approach:
      standoff: 0.60
      max_standoff: 1.80

    # Ask a describer (g1_object_describer) to name objects from their best crop.
    describe: false
    describe_after: 3
    describe_retry_s: 60.0
    # Objects only ever seen as a sliver narrower than this, px, keep the detector's label.
    describe_min_crop: 32
    # Rooms are asked about with up to this many whole frames, one per viewpoint reached in them,
    # once the camera has seen this share of their floor, and only while the type their objects
    # give is below this confidence.
    describe_room_views: 3
    describe_room_coverage: 0.8
    describe_rooms_below: 0.8
