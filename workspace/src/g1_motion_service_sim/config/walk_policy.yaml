# Parameters for the walking policy inside the motion_service_sim node
# (SIM-ONLY -- see README.md's safety banner). Wildcard node match so this file
# works regardless of the node's name/namespace at launch time.
#
# Everything here is transcribed from the reference package's model_config.json
# and g1_rl.xml -- see README.md's "Walking policy" section for provenance.
/**:
  ros__parameters:
    walk_policy:
      # Derived from `not pin_pelvis` by sim.launch.py: the weld and the policy
      # are the two possible owners of the legs and must never both be active.
      enabled: true

      # Empty -> share/g1_motion_service_sim/policy/walker.onnx. The weights live in a
      # separate walker.onnx.data that ONNX Runtime resolves relative to this
      # path, so a custom path must have both files side by side.
      onnx_model_path: ""

      # 50 Hz, matching the policy's training decimation. unitree_mujoco steps
      # at 0.002 s, so this is every 10th physics tick; the reference package
      # reached the same 50 Hz as every 4th tick of a 0.005 s step. Verified
      # equivalent in sim -- the policy rate is what matters, not the substep.
      rate_hz: 50.0

      # Leg authority is gated on policy FRESHNESS, not on FSM state: if no
      # policy target lands within this window (5 missed ticks), publishTick()
      # falls back to the stiff hold rather than re-sending a stale target.
      # In-process this should never trip; it is a cheap invariant against an
      # inference stall.
      staleness_timeout_ms: 100.0

      # The 29 policy outputs in Unitree DDS motor-index order (0-28). This
      # order is asserted against kDdsMotorOrder at startup and in
      # test_walk_policy -- a silent permutation here would land every gain and
      # target on the wrong joint, which is exactly the bug the reference
      # package shipped (it indexed a 29-name list into a 43-joint model).
      joint_names:
        - left_hip_pitch_joint      # 0
        - left_hip_roll_joint       # 1
        - left_hip_yaw_joint        # 2
        - left_knee_joint           # 3
        - left_ankle_pitch_joint    # 4
        - left_ankle_roll_joint     # 5
        - right_hip_pitch_joint     # 6
        - right_hip_roll_joint      # 7
        - right_hip_yaw_joint       # 8
        - right_knee_joint          # 9
        - right_ankle_pitch_joint   # 10
        - right_ankle_roll_joint    # 11
        - waist_yaw_joint           # 12
        - waist_roll_joint          # 13
        - waist_pitch_joint         # 14
        - left_shoulder_pitch_joint # 15
        - left_shoulder_roll_joint  # 16
        - left_shoulder_yaw_joint   # 17
        - left_elbow_joint          # 18
        - left_wrist_roll_joint     # 19
        - left_wrist_pitch_joint    # 20
        - left_wrist_yaw_joint      # 21
        - right_shoulder_pitch_joint # 22
        - right_shoulder_roll_joint  # 23
        - right_shoulder_yaw_joint   # 24
        - right_elbow_joint          # 25
        - right_wrist_roll_joint     # 26
        - right_wrist_pitch_joint    # 27
        - right_wrist_yaw_joint      # 28

      # The posture the policy's actions are offsets from, and the same posture
      # the observation's joint_pos is measured relative to. A crouch: hips and
      # ankles pitched back, knees bent. We cannot spawn the robot in it --
      # unitree_mujoco ignores <keyframe> and owns its own MjData -- so the
      # policy settles into it from the model's straight-legged spawn pose
      # in about 0.2 s. All 29 entries: the arm values feed the observation
      # even though /arm_sdk owns those motors.
      default_joint_pos:
        [-0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
         -0.312, 0.0, 0.0, 0.669, -0.363, 0.0,
          0.0, 0.0, 0.0,
          0.2, 0.2, 0.0, 0.6, 0.0, 0.0, 0.0,
          0.2, -0.2, 0.0, 0.6, 0.0, 0.0, 0.0]

      # target = default_joint_pos + action * action_scales, per joint.
      action_scales:
        [0.547546, 0.350661, 0.547546, 0.350661, 0.438577, 0.438577,
         0.547546, 0.350661, 0.547546, 0.350661, 0.438577, 0.438577,
         0.547546, 0.438577, 0.438577,
         0.438577, 0.438577, 0.438577, 0.438577, 0.438577, 0.074501, 0.074501,
         0.438577, 0.438577, 0.438577, 0.438577, 0.438577, 0.074501, 0.074501]

      # Gains for the 15 motors the policy owns (legs 0-11 + waist 12-14).
      # Taken from g1_rl.xml's position actuators, which are what actually
      # drove the policy during its sim validation. A MuJoCo position actuator
      # computes f = kp*(ctrl - q) - kv*qdot, which is exactly the law
      # unitree_mujoco's DDS bridge computes from /lowcmd
      # (tau = kp*(q_des - q) + kd*(0 - dq)), so these transfer 1:1 onto the
      # wire. Arms keep motion_service_sim.yaml's arm_hold_kp/kd -- /arm_sdk
      # owns motors 15-28 and the policy's arm actions are discarded.
      lower_kp: [40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
                 40.179, 99.098, 40.179, 99.098, 28.501, 28.501,
                 40.179, 28.501, 28.501]
      lower_kd: [2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
                 2.558, 6.309, 2.558, 6.309, 1.814, 1.814,
                 2.558, 1.814, 1.814]

      # Policy-side clamp on [vx, vy, vyaw]. /api/sport/request is an open DDS
      # channel, so this is a trust boundary in its own right, not redundancy
      # with g1_locomotion's own clamp.
      max_velocity: [1.0, 0.8, 2.0]

      # The latched command expires this long after arrival, using the request's
      # own `duration` field clamped to this maximum. Our bridge always sends
      # 1.0 s and re-issues well above 1 Hz, so a dead bridge stops the robot
      # within a second; clamping means a rogue client cannot latch the vendor's
      # 864000 s "continuous" value and walk away.
      velocity_duration_max_s: 2.0

      # ADVISORY ONLY -- never applied to the command. Measured gait-initiation
      # thresholds for this policy: below these it stands perfectly still rather
      # than stepping, with no hysteresis. Commands below them are passed
      # through unchanged and logged, never scaled up: turning a small command
      # into a large motion is precisely the ramp-don't-snap rule this stack is built on.
      # Measured [vx, vy, vyaw] -- see README for the full table.
      gait_initiation_threshold: [0.40, 0.50, 1.50]
