g1_vla_server:
  ros__parameters:
    engine_timeout_s: 10.0

    # A chunk opening this far from the measured pose means the policy misread the state, and
    # executing it would snap the arm through unchecked space.
    max_start_jump_rad: 0.15
    # Per-waypoint validity only holds while consecutive waypoints stay close.
    max_segment_step_rad: 0.20
    # Fraction of each joint's limit in joint_limits.yaml a chunk may ask for. Above a planned
    # motion's: slowing a policy chunk breaks its feedback loop rather than making it safer.
    velocity_scaling: 0.8

    # Minimum time between chunks sent in trajectory mode. Each replaces the running trajectory,
    # so without this the loop runs at the engine's answer rate, which for the mock is unbounded.
    replan_period_s: 0.15

    # A rejected chunk leaves the arm where it was and the policy head is stochastic, so asking
    # again is a real retry. This many in a row means the scene is blocking it.
    max_rejected_chunks: 5
    timeout_s: 90.0
    chunk_exec_timeout_s: 10.0

    # Rise of the object's height on /objects that counts as a grasp, m.
    success_lift_m: 0.05
    object_timeout_ms: 1000.0

    # Only used with the launch argument execution_mode:=servo, which streams the arm's share of
    # each chunk as jog commands.
    servo_topic: /servo_node/delta_joint_cmds
    servo_publish_rate: 50.0
