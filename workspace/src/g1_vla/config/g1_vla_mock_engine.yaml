g1_vla_mock_engine:
  ros__parameters:
    # Right arm swung out to the side, away from the bench, so validity does not depend on how the
    # octomap filled in. Retarget into a collision and every chunk should be rejected.
    joint_names:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_elbow_joint
    target_positions: [0.0, -0.55, 0.3]

    steps_per_chunk: 8
    action_dt_s: 0.1
    # rad per waypoint: 0.3 rad/s, well inside the gate's velocity_scaling of the 1.0 rad/s limit.
    step_rad: 0.03
