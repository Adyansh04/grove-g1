# Limits the gate checks policy chunks and servo jogs against, loaded only by vla.launch.py.
# g1_moveit_config's values with the arms at 1.0 rad/s instead of 0.8: a chunk is timed at its
# training rate, and slowing it is not a safer version of the same motion.

