g1_vla_groot_adapter:
  ros__parameters:
    # The server runs on the host; the container is host-networked.
    server_address: tcp://127.0.0.1:5555
    zmq_timeout_ms: 8000

    # Minimum waypoint spacing, s. The training rate's spacing asks for about 3 rad/s; 0.125 s
    # keeps a chunk inside the 1.0 rad/s the arm tracks.
    action_dt_s: 0.125

    # Waypoints kept per prediction. The gate replaces the running trajectory on every answer, so
    # validating the whole prediction only refuses collisions the arm would never reach.
    max_horizon: 8

    # rad/s used to stretch too-fast segments, not to reject them. Under the gate's allowance, so
    # a chunk paced here passes.
    max_joint_speed: 0.7

    # Only catches a stopped camera: the simulated one can go over a second between frames.
    max_image_age_s: 5.0

    # The server converts relative predictions back to absolute before replying. Use
    # "relative_to_observation" only for a server that does not.
    action_mode: absolute

    # Wall time per step of frame history. The recording rate is not on the wire, so this is
    # tuned rather than derived.
    history_step_s: 0.0333

    # Keys belong to the checkpoint and are unprefixed; joint order is the order of that key's
    # vector. The adapter refuses to serve while any state or video key is unmapped.
    state_joints:
      left_arm:
        - left_shoulder_pitch_joint
        - left_shoulder_roll_joint
        - left_shoulder_yaw_joint
        - left_elbow_joint
        - left_wrist_roll_joint
        - left_wrist_pitch_joint
        - left_wrist_yaw_joint
      right_arm:
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
      # Fingers first, thumb last, matching the checkpoint (its dims 4-6 are thumb_0/1/2 by
      # range). Thumb-first sends the finger commands to the thumb and the hand never closes.
      left_hand:
        - left_hand_index_0_joint
        - left_hand_index_1_joint
        - left_hand_middle_0_joint
        - left_hand_middle_1_joint
        - left_hand_thumb_0_joint
        - left_hand_thumb_1_joint
        - left_hand_thumb_2_joint
      right_hand:
        - right_hand_index_0_joint
        - right_hand_index_1_joint
        - right_hand_middle_0_joint
        - right_hand_middle_1_joint
        - right_hand_thumb_0_joint
        - right_hand_thumb_1_joint
        - right_hand_thumb_2_joint
      waist:
        - waist_yaw_joint
        - waist_roll_joint
        - waist_pitch_joint

    # Wrist pose from TF. The parent frame is the recording rig's convention, which the
    # checkpoint does not state; vary it first if the reach is wrong.
    state_eef_frames:
      left_wrist_eef_9d: [pelvis, left_wrist_yaw_link]
      right_wrist_eef_9d: [pelvis, right_wrist_yaw_link]

    # Only what this skill drives; the server's waist, base height and navigate keys are ignored.
    action_joints:
      right_arm:
        - right_shoulder_pitch_joint
        - right_shoulder_roll_joint
        - right_shoulder_yaw_joint
        - right_elbow_joint
        - right_wrist_roll_joint
        - right_wrist_pitch_joint
        - right_wrist_yaw_joint
      right_hand:
        - right_hand_index_0_joint
        - right_hand_index_1_joint
        - right_hand_middle_0_joint
        - right_hand_middle_1_joint
        - right_hand_thumb_0_joint
        - right_hand_thumb_1_joint
        - right_hand_thumb_2_joint

    video_topics:
      ego_view: /camera/color/image_raw
