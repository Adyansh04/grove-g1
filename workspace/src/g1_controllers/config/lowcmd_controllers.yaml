# controller_manager config for the whole-body rt/lowcmd stack.
#
# The component leaves any unclaimed joint unpowered, so these disjoint sets cover all 29 body
# motors at every instant:
#
#   locomotion_safety_controller  12 legs + waist roll/pitch, fed by the AGILE policy   14
#   waist_freeze_controller       waist yaw                                              1
#   arm_freeze_controller  OR  arm_trajectory_controller   the 14 arm joints            14
#
# The arm bracket swaps the arm pair in one switch, which ros2_control applies atomically. The
# hands are separate components, started inactive and activated by the same bracket.

controller_manager:
  ros__parameters:
    # Hz. Fixed by the policy: 50 Hz inference at decimation 4.
    update_rate: 200

    # SCHED_FIFO. Without it the 5 ms tick overruns once perception shares the machine, and a
    # balance policy fed stale observations diverges.
    thread_priority: 80

    # Both hands wait for the arm bracket, so a Dex3 that is absent or unpowered fails at a
    # point we control rather than during startup.
    hardware_components_initial_state:
      inactive:
        - "G1Dex3SystemLeft"
        - "G1Dex3SystemRight"

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    waist_freeze_controller:
      type: g1_controllers/G1FreezeController

    arm_freeze_controller:
      type: g1_controllers/G1FreezeController

    locomotion_freeze_controller:
      type: g1_controllers/G1FreezeController

    locomotion_safety_controller:
      type: g1_controllers/G1SafetyController

    agile_controller:
      type: g1_controllers/G1AgileController

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    interfaces:
      - position
      - velocity
      - effort

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: pelvis

# Neither the policy nor MoveIt commands waist yaw, so it is held for the whole session.
waist_freeze_controller:
  ros__parameters:
    kp: 10.0
    kd: 1.0
    joints:
      - waist_yaw_joint

# Holds the arms whenever MoveIt does not; swapped 1:1 with arm_trajectory_controller.
arm_freeze_controller:
  ros__parameters:
    # Matches g1_description's position_only gains for shoulders and elbows (300/4), so the
    # MoveIt handover keeps their stiffness. The wrists run 150/3 there, so theirs steps.
    kp: 300.0
    kd: 4.0
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint

# The safety controller's emergency target. Claims exactly its joints: a wider set could not
# activate while the arm and waist are owned, leaving the legs with no controller.
locomotion_freeze_controller:
  ros__parameters:
    kp: 10.0
    kd: 1.0
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_roll_joint
      - waist_pitch_joint

# The blend stage the policy writes through. Joint order here fixes the reference-interface
# layout, not the policy's own ordering, which the controller maps by name.
locomotion_safety_controller:
  ros__parameters:
    # Follow the policy. The code default, 0.0, holds the activation pose; first hardware
    # bring-up should start there and raise it by hand.
    blend_ratio: 1.0
    # Per second. Fast so the blend completes before the sim drops its pelvis weld, 0.5 s after
    # every motor is first driven: a partially blended static pose topples.
    max_blend_ratio_speed: 20.0
    # Unclamped: throttling a balance policy's corrections is what makes it fall.
    max_velocity: [-1.0]
    # Fallback gains, used before the policy's first inference and for the post-emergency hold.
    kp: [100.0]
    kd: [2.0]
    # rad/s, mean and peak joint speed. Beyond these the policy has diverged.
    mean_velocity_limit: 10.0
    max_velocity_limit: 35.0
    emergency_controller: locomotion_freeze_controller
    joints:
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_hip_yaw_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_hip_yaw_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
      - waist_roll_joint
      - waist_pitch_joint

agile_controller:
  ros__parameters:
    # Empty resolves to the policy shipped in this package's share directory.
    model_path: ""
    # Nav2's controller_server output, with no smoother in between.
    cmd_vel_topic: /cmd_vel
    imu_sensor_name: imu
    decimation: 4
    command_prefix: locomotion_safety_controller
    command_suffix: _raw
    # s. A silent publisher reads as a zero command, so a dead planner halts the robot.
    cmd_vel_timeout: 0.5
    # m/s and rad/s. The policy saturates beyond these, so clamping keeps commanded and achieved
    # velocity consistent for Nav2.
    max_linear_speed: 0.6
    max_angular_speed: 0.9

# MoveIt's arm path. Only the position interface is claimed, which puts these joints on the
# component's position-only branch and its position_only_kp/kd from the URDF.
arm_trajectory_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    # MoveIt plans one 7-joint arm at a time; without this the JTC rejects goals naming fewer
    # than all 14.
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0

# Dex3 wire order. The JTC maps by name, but g1_moveit_config's drift test pins this list to the
# SRDF and to the positional order the hand component writes.
left_hand_controller:
  ros__parameters:
    joints:
      - left_hand_thumb_0_joint
      - left_hand_thumb_1_joint
      - left_hand_thumb_2_joint
      - left_hand_middle_0_joint
      - left_hand_middle_1_joint
      - left_hand_index_0_joint
      - left_hand_index_1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    # A grasp usually drives some fingers and leaves others where they are.
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0

right_hand_controller:
  ros__parameters:
    joints:
      - right_hand_thumb_0_joint
      - right_hand_thumb_1_joint
      - right_hand_thumb_2_joint
      - right_hand_middle_0_joint
      - right_hand_middle_1_joint
      - right_hand_index_0_joint
      - right_hand_index_1_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 5.0
