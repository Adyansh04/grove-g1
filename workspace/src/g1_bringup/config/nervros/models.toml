# Models for NervROS on the G1. Claude Haiku 5.5 talks and looks first, and Sonnet 5.5 advises when
# a request's plans keep failing their checks, paid against a budget no call passes; so the GPU
# needs no local model beside the simulator and SAM 3.1. After them come the free models: the local
# model, then the Flash-Lites and Gemma 4 on Gemini's free tier and Nemotron 3 Super on
# OpenRouter's. Gemini's free tier outlines what `segment` is asked for, and Gemini Robotics-ER 2
# judges what the cameras show where it counts: whether a mission did what it says, when something
# happened, and a flagged plan against the scene. Without a key file its provider's models are left
# out: without Gemini's, `segment` needs its service backend.

[[provider]]
id = "local"
kind = "openai_compat"
base_url = "http://127.0.0.1:8081/v1"      # workspace/src/nervros/scripts/local-llm.sh
timeout_s = 120

[[provider]]
id = "gemini"
kind = "gemini_interactions"
key = { file = "~/api_keys/gemini.env" }

# free_only: NervROS refuses at start-up any model here that OpenRouter does not price at zero.
[[provider]]
id = "openrouter"
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
key = { file = "~/api_keys/openrouter.key" }
free_only = true
headers = { "X-Title" = "NervROS" }

# A second key: its free requests take over when the first key's are spent or it expires.
[[provider]]
id = "openrouter2"
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
key = { file = "~/api_keys/openrouter_2.key" }
free_only = true
headers = { "X-Title" = "NervROS" }

# Claude, paid against a hard budget: the key's $100 of credit less a margin for calls in flight,
# counted in one file every NervROS on this machine shares.
[[provider]]
id = "anthropic"
kind = "anthropic"
key = { file = "~/api_keys/claude_api.key" }
budget = { usd = 95.0, spent_file = "~/.config/nervros/claude-spend.json" }

[[model]]
id = "qwen3.5-9b-local"
provider = "local"
model = "qwen3.5-9b"
vision = true
tools = true
privacy = { local = true }
# local-llm.sh starts llama.cpp with --ctx-size 32768 and an 8-bit KV cache, in the VRAM 16384
# took at 16 bits: the tools and persona take about 12k of it.
context = 32768
stream = true
# Qwen's sampling for non-thinking use, over llama.cpp's defaults (0.8, top_k 40, top_p 0.95,
# min_p 0.05): on 16 eval cases, three trials each, pass^3 0.94 against 0.81 at the same cost.
params = { temperature = 0.7, top_p = 0.8, top_k = 20, min_p = 0.0, presence_penalty = 1.0 }

# Google's free tier allows 5 a minute and 20 a day of 3.8 Flash, and 15 and 500 of the Flash-Lite
# models, per project and model; canopy's describer draws on the same project, so these caps leave
# it room. 3.8 Flash outlines best; at low thinking it answers in a few seconds.
[[model]]
id = "gemini-3.8-flash"
provider = "gemini"
model = "gemini-3.8-flash"
vision = true
limits = { rpm = 4, rpd = 10 }
privacy = { trains = true }
params = { generation_config = { thinking_level = "low" } }

[[model]]
id = "gemini-3.5-flash-lite"
provider = "gemini"
model = "gemini-3.5-flash-lite"
vision = true
tools = true
limits = { rpm = 10, rpd = 250 }
privacy = { trains = true }

[[model]]
id = "gemini-3.1-flash-lite"
provider = "gemini"
model = "gemini-3.1-flash-lite"
vision = true
tools = true
limits = { rpm = 10, rpd = 250 }
privacy = { trains = true }

# 30 a minute, 14,400 a day and 16K input tokens a minute on the free tier, shared with canopy's
# describer.
[[model]]
id = "gemma-4-26b"
provider = "gemini"
model = "gemma-4-26b-a4b-it"
vision = true
tools = true
limits = { rpm = 10, rpd = 2000 }
privacy = { trains = true }

# A camera watch's own share of the Flash-Lites, so watches cannot spend what the other roles fall
# back on: with the ids above, 14 a minute and 400 a day of each model's 15 and 500.
[[model]]
id = "watch-3.5-flash-lite"
provider = "gemini"
model = "gemini-3.5-flash-lite"
vision = true
limits = { rpm = 4, rpd = 150 }
privacy = { trains = true }

[[model]]
id = "watch-3.1-flash-lite"
provider = "gemini"
model = "gemini-3.1-flash-lite"
vision = true
limits = { rpm = 4, rpd = 150 }
privacy = { trains = true }

# Gemini Robotics-ER 2 reads a scene better than the general models (a cup in the bin, the frame
# where a door opened), but the free tier allows 5 a minute and 20 a day. One id per use splits that
# day between them; a use whose share is gone falls through to Gemma 4, the Flash-Lites, then the
# local model.
[[model]]
id = "er2-witness"
provider = "gemini"
model = "gemini-robotics-er-2-preview"
vision = true
limits = { rpm = 2, rpd = 10, pool = "er2" }
privacy = { trains = true }

[[model]]
id = "er2-moment"
provider = "gemini"
model = "gemini-robotics-er-2-preview"
vision = true
limits = { rpm = 2, rpd = 6, pool = "er2" }
privacy = { trains = true }

[[model]]
id = "er2-scene"
provider = "gemini"
model = "gemini-robotics-er-2-preview"
vision = true
limits = { rpm = 1, rpd = 4, pool = "er2" }
privacy = { trains = true }

# Text only. Of OpenRouter's free models with tools on 7 Oct, the one that answered: its Gemma 4s
# were rate-limited upstream and Inkling takes no plain API calls.
[[model]]
id = "nemotron-super-or"
provider = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
tools = true
limits = { rpm = 20, pool = "openrouter_free" }
privacy = { trains = true }

# Past 100K prompt tokens Haiku's price rises fivefold: the conversation is condensed before.
[[model]]
id = "claude-haiku-5.5"
provider = "anthropic"
model = "claude-haiku-5-5"
vision = true
tools = true
max_tokens = 16000
context = 90000
price = { input = 0.10, output = 0.50, cache_read = 0.01, cache_write = 0.125 }

[[model]]
id = "claude-sonnet-5.5"
provider = "anthropic"
model = "claude-sonnet-5-5"
vision = true
tools = true
max_tokens = 16000
context = 64000
price = { input = 2.0, output = 10.0, cache_read = 0.20, cache_write = 2.50 }

[[model]]
id = "nemotron-super-or2"
provider = "openrouter2"
model = "nvidia/nemotron-3-super-120b-a12b:free"
tools = true
limits = { rpm = 20, pool = "openrouter2_free" }
privacy = { trains = true }

[pools]
# A thousand free requests a day once the account holds credit.
openrouter_free = { rpd = 1000 }
openrouter2_free = { rpd = 1000 }
er2 = { rpd = 20 }

[roles]
# Gemma comes last: 16K input tokens a minute hold one or two agent calls.
routine = [
    "claude-haiku-5.5",
    "qwen3.5-9b-local",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
    "nemotron-super-or",
    "nemotron-super-or2",
    "gemma-4-26b",
]
# Asked only after two failed plans for one request, so Sonnet's price and 3.8 Flash's few
# requests a day both suffice.
plan = ["claude-sonnet-5.5", "gemini-3.8-flash", "gemini-3.5-flash-lite"]
vision_check = [
    "claude-haiku-5.5",
    "qwen3.5-9b-local",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
    "gemma-4-26b",
]
summarise = [
    "claude-haiku-5.5",
    "qwen3.5-9b-local",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
]
segment = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
# Gemma 4 comes last in the vision chains: on 17 Oct its image requests ran into the 60 s timeout
# and it answered text with "high demand", which made each camera watch's look a minute late.
# Start and end frames of both cameras, four images in one request.
witness = ["er2-witness", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemma-4-26b"]
# Up to a dozen frames, more than Gemma's 16K tokens a minute hold.
moment = ["er2-moment", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
# A look every 15 s while the view changes, none while it stays as it was after a no; at most two
# watches. Their own Flash-Lite ids cap what they spend, then the local model looks.
watch = ["watch-3.5-flash-lite", "watch-3.1-flash-lite"]
scene_check = ["er2-scene", "gemini-3.5-flash-lite", "gemma-4-26b"]
