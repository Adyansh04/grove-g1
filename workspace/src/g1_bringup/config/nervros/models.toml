# Models for NervROS on the G1, all free: the local model talks, plans and looks; Gemini's free
# tier outlines what `segment` is asked for, which the local model cannot, and advises when the
# local model's plans for a request keep failing their checks. Without the local model, as when
# SAM 3.1 holds the GPU, the Flash-Lites and Gemma 4 on the same free tier talk and look instead,
# and Nemotron 3 Super on OpenRouter's free tier talks when their quotas are spent. Without a key
# file its provider's models are left out: without Gemini's, `segment` needs its service backend,
# and there is no advice.

[[provider]]
id = "local"
kind = "openai_compat"
base_url = "http://127.0.0.1:8081/v1"      # workspace/src/nervros/scripts/local-llm.sh
timeout_s = 120

[[provider]]
id = "gemini"
kind = "gemini_interactions"
key = { file = "~/.config/grove/gemini.env" }

# free_only: NervROS refuses at start-up any model here that OpenRouter does not price at zero.
[[provider]]
id = "openrouter"
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
key = { file = "~/.config/openrouter.key" }
free_only = true
headers = { "X-Title" = "NervROS" }

[[model]]
id = "qwen3.5-9b-local"
provider = "local"
model = "qwen3.5-9b"
vision = true
tools = true
privacy = { local = true }
# local-llm.sh starts llama.cpp with --ctx-size 16384: the conversation is compacted to fit.
context = 16384
stream = true
# Qwen's sampling for non-thinking use, over llama.cpp's defaults (0.8, top_k 40, top_p 0.95,
# min_p 0.05): on 16 eval cases, three trials each, pass^3 0.94 against 0.81 at the same cost.
params = { temperature = 0.7, top_p = 0.8, top_k = 20, min_p = 0.0, presence_penalty = 1.0 }

# Google's free tier allows 5 a minute and 20 a day of 3.8 Flash, and 15 and 500 of the Flash-Lite
# models, per project and model; canopy's describer draws on the same project, so these caps leave
# it room. 3.8 Flash outlines best; at low thinking it answers in a few seconds.
[[model]]
id = "gemini-3.8-flash"
provider = "gemini"
model = "gemini-3.8-flash"
vision = true
limits = { rpm = 4, rpd = 10 }
privacy = { trains = true }
params = { generation_config = { thinking_level = "low" } }

[[model]]
id = "gemini-3.5-flash-lite"
provider = "gemini"
model = "gemini-3.5-flash-lite"
vision = true
tools = true
limits = { rpm = 10, rpd = 250 }
privacy = { trains = true }

[[model]]
id = "gemini-3.1-flash-lite"
provider = "gemini"
model = "gemini-3.1-flash-lite"
vision = true
tools = true
limits = { rpm = 10, rpd = 250 }
privacy = { trains = true }

# 30 a minute, 14,400 a day and 16K input tokens a minute on the free tier, shared with canopy's
# describer.
[[model]]
id = "gemma-4-26b"
provider = "gemini"
model = "gemma-4-26b-a4b-it"
vision = true
tools = true
limits = { rpm = 10, rpd = 2000 }
privacy = { trains = true }

# Text only. Of OpenRouter's free models with tools on 7 Oct, the one that answered: its Gemma 4s
# were rate-limited upstream and Inkling takes no plain API calls.
[[model]]
id = "nemotron-super-or"
provider = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
tools = true
limits = { rpm = 20, pool = "openrouter_free" }
privacy = { trains = true }

[pools]
# A thousand free requests a day once the account holds credit.
openrouter_free = { rpd = 1000 }

[roles]
# Gemma comes last: 16K input tokens a minute hold one or two agent calls.
routine = [
    "qwen3.5-9b-local",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
    "nemotron-super-or",
    "gemma-4-26b",
]
# Asked only after two failed plans for one request, so 3.8 Flash's few requests a day suffice.
plan = ["gemini-3.8-flash", "gemini-3.5-flash-lite"]
vision_check = [
    "qwen3.5-9b-local",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
    "gemma-4-26b",
]
summarise = ["qwen3.5-9b-local", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
segment = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
