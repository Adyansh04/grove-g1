# Held out: the same kinds of request as apartment.toml in other words, for judging models. Never
# tune prompts, tools or skills on these, or their score stops saying how a model does on what it
# has not seen. A failure here is read, then fixed through a case in apartment.toml.
# Run it as apartment.toml, on a recording or the live stack; the robot's place carries from case
# to case, so the order matters.

truth = { topic = "/g1_sensor_relay/base_state" }

[[case]]
id = "ahead"
say = ["Describe what is in front of you."]
expect = { tools = ["look"], mission = "none" }

[[case]]
id = "chest-floor"
say = ["Use the chest camera: is anything lying on the floor?"]
expect = { tools = ["look"], mission = "none" }

[[case]]
id = "find-tray"
say = ["Do you know where the wooden tray is?"]
expect = { tools = ["find_objects"], mission = "none", reply_has = ["tray"] }

[[case]]
id = "how-many-rooms"
say = ["How many rooms does this place have?"]
expect = { tools = ["list_places"], mission = "none" }

[[case]]
id = "hands"
say = ["Is anything in your hands right now?"]
expect = { tools = ["robot_state"], mission = "none" }

[[case]]
id = "lidar-rate"
say = ["What rate is the lidar running at?"]
expect = { tools = ["topic_sample"], mission = "none", reply_has = ["hz"] }

[[case]]
id = "amcl-up"
say = ["Is AMCL running?"]
expect = { tools = ["ros_graph"], mission = "none", reply_has = ["amcl"] }

[[case]]
id = "how-far"
say = ["How far away is the bedroom? Don't go there, just tell me."]
expect = { tools = ["nav_check"], mission = "none", approvals_max = 0 }

[[case]]
id = "unknown-thing"
say = ["Have you seen a blue dragon anywhere? Stay where you are."]
expect = { tools = ["find_objects"], mission = "none", approvals_max = 0 }

[[case]]
id = "two-readings"
say = ["Check two things for me: the lidar's rate and whether Nav2's planner is up."]
expect = { tools = ["topic_sample", "ros_graph"], mission = "none", reply_has = ["hz"] }

[[case]]
id = "forward"
say = ["Walk forward one and a half metres."]
expect = { skills = ["WalkStraight"], mission = "success", approvals_max = 1, moved_m = [1.0, 2.0] }

[[case]]
id = "clockwise"
say = ["Rotate 45 degrees clockwise."]
expect = { skills = ["TurnInPlace"], mission = "success", approvals_max = 1, turned_deg = [-70, -20] }

[[case]]
id = "back-up"
say = ["Back up by 30 centimetres."]
expect = { skills = ["WalkStraight"], mission = "success", approvals_max = 1, moved_m = [0.15, 0.5] }

[[case]]
id = "walk-turn-walk"
# One plan with its legs in order, not three missions.
say = ["Walk forward a metre, turn left 90 degrees, then walk forward another metre."]
max_s = 300
expect = { skills = ["WalkStraight", "TurnInPlace"], mission = "success", approvals_max = 1, turned_deg = [60, 120] }

[[case]]
id = "go-office"
say = ["Head over to the office."]
max_s = 300
expect = { tools = ["run_mission"], mission = "success", approvals_max = 1 }

[[case]]
id = "keep-out-study"
say = ["Never let the robot go into the study.", "Now go to the study."]
max_s = 300
expect = { tools = ["geofence"], mission = "none", tool_said = ["added the keep-out zone"] }

[[case]]
id = "lift-keep-out"
say = ["The study is fine again, drop that keep-out zone."]
expect = { tools = ["geofence"], mission = "none", tool_said = ["removed the keep-out zone"] }

[[case]]
id = "walk-up-to-it"
# "It" is only in the turn before.
say = ["Where is the wooden tray?", "Walk up to it."]
max_s = 300
expect = { tools = ["find_objects", "run_mission"], mission = "success", approvals_max = 1 }

[[case]]
id = "note"
say = ["Please note that the charger is behind the sofa."]
expect = { tools = ["memory"], mission = "none" }

[[case]]
id = "recall-note"
say = ["Where did I say the charger is?"]
expect = { mission = "none", reply_has = ["sofa"] }

[[case]]
id = "carry"
say = ["Bring the red mug over to the wooden tray."]
max_s = 600
expect = { skills = ["PickObject", "PlaceInto"], mission = "success" }

[[case]]
id = "desk-place"
# Judged on the plan: on the live stack the mug is in the tray by now, so its pick may fail.
say = ["Take the red mug and set it down on the office desk instead."]
max_s = 600
expect = { skills = ["PickObject", "PlaceOn"], approvals_max = 1 }

[[case]]
id = "no-floor"
say = ["Actually, just put the mug on the floor next to you."]
expect = { mission = "none", approvals_max = 0 }

[[case]]
id = "that-over-there"
say = ["Move that over there."]
expect = { mission = "none", approvals_max = 0, reply_has = ["which", "what", "where"] }

[[case]]
id = "room-tour"
# One plan through every room, in the order given.
say = ["Go through the living room, then the hallway, then stop in the bedroom."]
max_s = 600
expect = { mission = "success", approvals_max = 1 }

[[case]]
id = "return"
say = ["Return to your starting point."]
max_s = 300
expect = { mission = "success" }
