# SIMULATION ONLY, a stand-in for friction: a grasp that holds here says nothing about the real
# Dex3. Scenes opt in by declaring `grasp_*` weld equalities, as the navigation world does.
grasp_weld:
  enabled: true

  # Welds an object to a hand while the thumb and one other digit touch it within this distance of
  # the palm origin. A released object re-arms once the palm is farther away than this.
  capture_radius_m: 0.16

  # Seconds without that contact before a held object is released.
  release_after_s: 0.3
