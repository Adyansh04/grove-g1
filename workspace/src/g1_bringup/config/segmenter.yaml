# canopy's segmenter on the G1, for world_model.launch.py segmenter:=true. It asks the vision
# server (Grounding DINO + SAM 2.1, ./scripts/serve.sh vision), whose masks follow a region such
# as a floor better than the semantic server's. The cameras come from the launch's cameras.
/**:
  ros__parameters:
    server_address: tcp://127.0.0.1:5560
    max_image_age_s: 2.0
    box_threshold: 0.30
    text_threshold: 0.25
    # The first request loads the models.
    zmq_timeout_ms: 30000
