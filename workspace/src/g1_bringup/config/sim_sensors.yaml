# Sensor sampling inside the patched unitree_mujoco, read via GROVE_G1_SENSOR_CONFIG; unset, the
# simulator runs its stock code path. The simulator process loads no ROS, so frames go over
# socket_path to g1_sensor_relay, which publishes them.
enabled: true

# A full sweep costs ~32 ms of raycasting. It has its own thread and never blocks physics, but it
# does cost a core.
rate_hz: 10.0
azimuth_steps: 360
elevation_steps: 32
range_max: 40.0

# The Mid360's IMU, on its own thread so the sweep never stalls it. 200 Hz as on the real Mid360:
# FAST-LIO's gravity init averages a fixed sample count, not a fixed time.
imu_rate_hz: 200.0

# sim.launch.py hands this to g1_sensor_relay as well.
socket_path: "/tmp/g1_sensors.sock"

# The D435i, rendered offscreen on the sensor thread. Depth leaves the simulator in metres.
camera_enabled: true

# Ground-truth object poses, sampled with each sweep. SIMULATION ONLY: the stand-in for perception
# and the source of the mock detector's masks. An explicit list because the pelvis has a free joint
# too; bodies missing from the staged scene are reported once and skipped.
object_bodies:
  - red_block
  - blue_block
  - green_cylinder
  - blue_sphere
  - yellow_box
  - white_cup
  # Static, but reported so a place has a target on /objects for g1_base_approach to range to.
  - brown_box

# SIMULATION ONLY, a stand-in for friction: a grasp that holds here says nothing about the real
# Dex3. Scenes opt in by declaring `grasp_*` weld equalities, as the navigation world does.
grasp_weld:
  enabled: true

  # Welds an object to a hand while the thumb and one other digit touch it within this distance of
  # the palm origin. A released object re-arms once the palm is farther away than this.
  capture_radius_m: 0.16

  # Seconds without that contact before a held object is released.
  release_after_s: 0.3
