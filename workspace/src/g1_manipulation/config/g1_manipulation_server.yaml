# Pick and place skills, loaded by g1_manipulation/launch/manipulation.launch.py.
#
# Everything here is real-robot code: the skills plan through move_group onto the controllers
# that own rt/arm_sdk and the hand topics, exactly as they will on hardware. What is
# simulation-only is where the object POSES come from, and that lives in
# g1_object_pose_source.yaml.
g1_manipulation_server:
  ros__parameters:
    # How old a pose may be before a pick refuses to act on it. The source publishes at the
    # sensor rate (10 Hz), so this tolerates several missed samples while still catching a
    # dead pipeline -- which matters, because the alternative is grasping at where an object
    # used to be.
    object_timeout_ms: 1000.0

    # How far above the grasp the approach starts, and how far the object is lifted after the
    # hand closes. Both are along the planning frame's z, which is up while the robot stands.
    #
    # MEASURED, not chosen: standing at the facility workbench, the hand only clears the table's
    # octomap at pelvis z 0.22 and above (m9-checks/why_blocked.py sweeps it). The cube sits at
    # pelvis z 0.0375, so anything under 0.185 of approach height puts the pregrasp inside the
    # map. At the old 0.12 it failed every time with GOAL_STATE_INVALID and the contact pair
    # <octomap> <-> right_hand_thumb_2_link -- the thumb, by a couple of centimetres.
    #
    # This cannot be fixed by exempting the octomap instead. The pregrasp transit is deliberately
    # collision-checked so the planner cannot route the arm through the table on the way in; the
    # exemption exists for the descent that follows and nothing else.
    approach_height_m: 0.22

    # How far under the object's TOP FACE the grasp frame is aimed, using the height the object
    # pose source reports. Not its centre, which is what this used to do.
    #
    # The roll points the hand's closing axis at the floor and the fingertips sit about 24 mm
    # beyond the grasp frame along it. Aim at the middle of a 60 mm cube and they reach to 6 mm
    # above the table, inside the octomap's own 20 mm padding, so the hand is asked to close
    # through the surface. Aiming 15 mm under the top face leaves them about 21 mm clear and
    # still well inside a 60 mm object.
    grasp_depth_below_top_m: 0.015
    # Has to clear the same 0.185 the pregrasp does, and for a sharper reason: the collision
    # exemption is restored at the end of the lift, so wherever the lift finishes becomes the
    # START state of the next collision-checked plan. Finishing inside the octomap leaves the
    # carry posture unplannable from a state that is already in collision.
    lift_height_m: 0.20

    # Well under joint_limits.yaml's own 0.8 rad/s per-joint cap. Arm motion measurably
    # disturbs a standing humanoid (docs/notes/arm-motion-and-balance.md), and scaling the
    # whole trajectory is preferred to clamping joints, which bends the path itself.
    velocity_scaling: 0.3
    planning_time_s: 10.0

    # The grasp geometry, for the RIGHT hand. The left mirrors automatically: its offset y and
    # z flip sign, and so does the roll, because the two hands are mirror images.
    #
    # COMPUTED from the URDF's finger chain at the SRDF's `closed` posture, not guessed. At
    # that posture the thumb tip is at palm (-0.030, +0.020, +0.017) and the middle and index
    # tips at (+0.050, +0.068, -/+0.029), so what the hand closes around sits at
    # (+0.010, +0.044, +0.009) -- barely forward of the palm origin, and mostly to its +y.
    #
    # That is the correction that mattered: the fingers curl toward the palm's +y, so it is the
    # ROLL that turns the grasp axis downward, not the pitch. The first version had the offset
    # 9 cm out along +x and pitched the palm instead, which asked the wrist to contort into a
    # pose that had no IK anywhere useful.
    #
    # docs/notes/m9-checks/ recomputes both numbers from the URDF.
    grasp_offset_xyz: [0.010, 0.044, 0.009]
    grasp_rpy: [-1.5707963, 0.0, 0.0]
