# Pick and place skills, loaded by g1_manipulation/launch/manipulation.launch.py.
#
# Real-robot code throughout; only where the object poses come from is simulation-specific, and
# that lives in g1_object_pose_source.yaml.
g1_manipulation_server:
  ros__parameters:
    # `object_timeout_ms` is a launch argument, not a key here: a node-named key beats the
    # launch override file, and how old a pose may be depends on what produces it.

    # Where the approach starts, along the planning frame's z. Measured: the hand clears the
    # workbench octomap only at 0.185 and above, and the pregrasp stays collision-checked so the
    # planner cannot route through the table on the way in.
    approach_height_m: 0.22

    # Above the object's TOP face, not its centre. The fingertips sit about 24 mm beyond the
    # grasp frame, so at 10 mm the palm clears the object and the fingers close down its sides;
    # past 20 mm on a 60 mm cube they start to slip off the top.
    grasp_height_above_top_m: 0.010
    # Clears the same 0.185: the exemption is restored at the end of the lift, so wherever it
    # finishes becomes the start state of the next collision-checked plan.
    lift_height_m: 0.20

    # Well under joint_limits.yaml's 0.8 rad/s cap: arm motion disturbs a standing humanoid, and
    # scaling the trajectory beats clamping joints, which bends the path.
    velocity_scaling: 0.3
    planning_time_s: 10.0

    # Samples per motion, all inside planning_time_s: ValidateSolution rejects paths OMPL accepted,
    # and that rejection returns fast enough to sample again.
    planning_attempts: 5
    grasp_rpy: [-1.5707963, 0.0, 0.0]

    # `grasp_source` is a launch argument, for the same reason `object_timeout_ms` is. There is
    # no fallback between the two: a pick quietly using the fixed pose would look like it worked.
    grasp_service: "/g1_grasp_engine/generate_grasps"

    # Must stay longer than the adapter's own zmq_timeout_ms (30 s in g1_graspgen_adapter.yaml):
    # give up first and a slow generator is reported silent while it is still working.
    grasp_timeout_s: 35.0

    # Candidates come back best first. Below this score they are not worth the inverse
    # kinematics call, and past this many the arm is not going to reach a better one.
    min_grasp_score: 0.5
    max_grasp_candidates: 20

    # How far from straight down a grasp may come in. Past a right angle it reaches up through
    # the table; the margin below leaves room for one across a corner.
    max_approach_tilt_deg: 75.0

    # Where the hand waits, back along the grasp's own approach axis rather than straight up: a
    # side grasp has its clear line along that axis and a ceiling above it.
    approach_standoff_m: 0.12

    # Per candidate, and there can be twenty of them, so this is a filter rather than a solve.
    ik_timeout_s: 0.05

    # The last move into a grasp is a straight line, as MoveIt's own pick pipeline does: how
    # finely it is walked, and how much must be clear before it is taken instead of planned.
    cartesian_step_m: 0.005
    cartesian_min_fraction: 0.8

    # `graspgen_to_grasp_frame_xyz_rpy` is a launch argument for the same reason: it describes
    # whichever generator is answering, and the stand-in's frame is not the real one's.
