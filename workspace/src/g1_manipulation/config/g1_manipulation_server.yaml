# Pick and place skills, loaded by g1_manipulation/launch/manipulation.launch.py.
#
# `object_timeout_ms`, `grasp_source`, `min_grip_height_m` and `graspgen_to_grasp_frame_xyz_rpy`
# are launch arguments, because their right values depend on what the stack is launched with.
# Everything else except velocity_scaling, grasp_rpy, grasp_service and publish_markers can be set
# live between goals.
g1_manipulation_server:
  ros__parameters:
    # Pregrasp height above the grasp. The hand clears the workbench octomap from about 0.185 up.
    approach_height_m: 0.22

    # How far below the object's top face the grasp frame aims. The palm face is 26 mm above the
    # frame, so a deeper grip drives the palm into the object.
    grasp_depth_below_top_m: 0.026

    # How close the grasp frame must measure to its target before the hand closes, and how many
    # corrections the arm gets to get there.
    settle_tolerance_m: 0.010
    settle_attempts: 2

    # Still this far off after the last descent, the pick is refused rather than closing on air.
    max_grasp_offset_m: 0.020
    # m. The widest a Dex3 closes round, thumb to fingers; a wider object is refused before moving.
    max_grasp_width_m: 0.090
    # m. Added to each side of the object's box in the planning scene, not to its height: the
    # measured box runs short and the arm lags its plan, so an unpadded box gets brushed.
    scene_object_padding_m: 0.02
    # GraspGenX describes the right Dex3 only: with grasp_source generated, the left hand still
    # grasps from the object's box.
    generated_grasp_arms: [right]

    # How far the object may shift between being located and the descent, and still be followed.
    # Larger than body sway means a different object or a bad frame.
    grasp_refresh_max_shift_m: 0.10

    # Where every descent starts, back up the approach axis from the grasp.
    reaim_clearance_m: 0.08

    # How long the arm gets to stop after a move before it is measured.
    settle_wait_s: 0.8

    # Lift above the grasp. The arm settles about 40 mm short of it under a held object.
    lift_height_m: 0.20
    lift_attempts: 3

    # Preplace height above the place pose, lower than the pick's because the target is raised.
    place_approach_height_m: 0.15
    # m. On a surface wider than place_container_max_m, a table rather than a tray, the object goes
    # where the hand reaches: this far ahead in the planning frame and place_side_m to the hand's
    # side, kept place_edge_margin_m inside the surface's edge.
    place_reach_m: 0.35
    place_side_m: 0.15
    place_edge_margin_m: 0.05
    place_container_max_m: 0.40

    # Hand closing. Spans are measured between the thumb and index links; closure is linear in
    # between. The close starts grip_start_margin_m outside the widest measured side (never wider
    # than grip_max_width_m), creeps in grip_search_step_m at a time until the thumb opposes a
    # finger, and gives up grip_search_beyond_m past the narrowest side.
    hand_close_s: 1.5
    hand_span_open_m: 0.124
    hand_span_closed_m: 0.058
    grip_preload_m: 0.002
    grip_start_margin_m: 0.010
    grip_max_width_m: 0.075
    grip_search_step_m: 0.002
    grip_search_beyond_m: 0.006

    # A contact is only judged once every finger is slower than this.
    grip_settled_speed_rad_s: 0.1

    # Past contact every finger is commanded to its stall plus this, so all press with kp times
    # the same error. More squeezes a round object out of the hand.
    grip_hold_bias_rad: 0.08

    # A finger is pressing when it is this far short of its target and pushing this hard. Finger kp
    # is about 2.2 N.m/rad, so a held finger reads at least 0.04 N.m and an empty one 0.01.
    grip_check_enabled: true
    grip_min_position_error_rad: 0.08
    grip_min_effort_nm: 0.03

    # How far a released object may read from where it was aimed. On a named surface the footprint
    # decides instead, with place_footprint_margin_m past the rim, and this only bounds the height.
    place_tolerance_m: 0.05
    place_footprint_margin_m: 0.02

    # How long the detector gets to find the object after the release. Not finding it fails the
    # place, since that is what a dropped object looks like.
    place_confirm_timeout_s: 4.0

    # How old a standing object's last sighting may be when the newest detections miss it. Matches
    # g1_base_approach, which runs just before on the same sighting.
    sighting_memory_s: 30.0

    # Wait after /clear_octomap for the sensor to put the visible surfaces back.
    octomap_rebuild_wait_s: 0.8

    # The arm lags its trajectory by several centimetres at speed, and that lag is clearance MoveIt
    # never checked, so it moves slowly.
    velocity_scaling: 0.15
    # MoveHand, for pointing and gestures: the farthest from the shoulder a hand is sent, the
    # distance a pointing hand stands from it, and the share of velocity_scaling it moves at.
    move_hand_max_reach_m: 0.48
    move_hand_point_reach_m: 0.40
    move_hand_speed: 0.6
    # s. The longest a hand move may take: a slower speed is raised to fit, up to velocity_scaling,
    # since a taught skill gives each move 45 s and one at a fifth of this speed took 44.
    move_hand_max_s: 30.0
    # A hand sent to a point may face any way: IK is tried in this many orientations besides its
    # own, and the arm plans to the solution nearest its pose now. A position-only goal leaves
    # MoveIt sampling orientations it cannot reach.
    move_hand_orientations: 32
    # The links a pointing arm's line starts at; the two set which way is out.
    move_hand_left_shoulder: left_shoulder_pitch_link
    move_hand_right_shoulder: right_shoulder_pitch_link
    # m. A target near the body's middle puts the pointing hand in front of the torso: it steps
    # out to its own side by these, in turn, until a pose clears the body.
    move_hand_point_side_steps_m: [0.06, 0.12, 0.18]
    planning_time_s: 10.0
    # Samples within planning_time_s: ValidateSolution rejects some paths OMPL accepts, quickly.
    planning_attempts: 5

    # Right hand's orientation at a top grasp; the left mirrors the roll.
    grasp_rpy: [-1.5707963, 0.0, 0.0]

    # Generated grasps only.
    grasp_service: "/g1_grasp_engine/generate_grasps"
    # Longer than the adapter's own zmq_timeout_ms (30 s), or a slow generator reads as silent.
    grasp_timeout_s: 35.0
    min_grasp_score: 0.5
    max_grasp_candidates: 20
    # Usable candidates kept, best first: when MoveIt finds no way to one's pregrasp, the next is
    # tried before the pick fails.
    grasp_tries: 3
    # Past a right angle a grasp reaches up through the surface.
    max_approach_tilt_deg: 75.0
    # Pregrasp distance back along a generated grasp's own approach axis.
    approach_standoff_m: 0.12
    # Per candidate, so this is a filter rather than a solve.
    ik_timeout_s: 0.05

    # Interpolation step for straight-line moves.
    cartesian_step_m: 0.005
