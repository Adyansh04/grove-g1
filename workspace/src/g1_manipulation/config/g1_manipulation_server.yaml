# Pick and place skills, loaded by g1_manipulation/launch/manipulation.launch.py.
#
# Real-robot code throughout; only where the object poses come from is simulation-specific, and
# that lives in g1_object_pose_source.yaml.
g1_manipulation_server:
  ros__parameters:
    # `object_timeout_ms` is a launch argument, not a key here: a node-named key beats the
    # launch override file, and how old a pose may be depends on what produces it.

    # Where the approach starts, along the planning frame's z. Measured: the hand clears the
    # workbench octomap only at 0.185 and above, and the pregrasp stays collision-checked so the
    # planner cannot route through the table on the way in.
    approach_height_m: 0.22

    # Below the object's TOP face, so the fingers close around it rather than on top of it.
    # Capped by the palm: the grasp frame is 26 mm clear of the palm's own face, so a deeper
    # grip drives the palm into the top of the object. See g1_common.xacro for both numbers.
    grasp_depth_below_top_m: 0.020

    # And never lower than this above whatever the object stands on, which wins when the two
    # disagree. Measured in MuJoCo: while it descends the hand hangs 63 mm below the grasp frame,
    # so the thumb's clearance over the surface is this minus 63 mm. At the old 0.068 that left
    # 5 mm against a descent that lands within 6-10 mm, and the thumb scraped the table and
    # dragged the object 44 mm before the fingers closed. 80 mm leaves 17.
    #
    # It also decides the props. The grip point can never be above the object, so an object has
    # to be at least this tall, and the hand takes nothing wider than 75 mm: no cube satisfies
    # both, which is why they are 60 wide and 90 tall.
    #
    # Together with the palm cap above, this makes a top grasp hold every block it can hold
    # ABOVE its centre of mass, which no amount of tuning fixes. The grip must sit at least
    # 0.080 above the base and at most grasp_depth_below_top_m under the top, and that cap is
    # 26 mm before the palm meets the object. Putting the grip at the centre of mass needs a
    # block at least 160 mm tall to clear the first and at most 52 mm tall to clear the second.
    #
    # So the block hangs, and the overhang is the lever it tips out on. Measured on the
    # navigation route, three missions out of three: the grip holds through the pick, the block
    # tilts from about 40 to about 47 degrees during the carry, slides out at 4 to 5 mm/s and
    # is on the floor within 25 seconds. Every finger is at its torque clamp throughout, so
    # this is geometry and not grip force.
    #
    # The way out is the grasp frame, not this number: at palm y 0.085 the thumb hangs 28 mm
    # below the frame instead of 63, which would allow min_grip_height_m near 0.045 and a block
    # short enough to sit in the hand rather than below it. See g1_common.xacro for why that
    # frame is not in place yet.
    min_grip_height_m: 0.080

    # How close the grasp frame must MEASURE to its target before the fingers close, and how many
    # corrections it gets. The arm is position-only and has no gravity compensation, so it always
    # settles somewhere short; the corrections are what close that gap.
    #
    # 10 mm was chosen when the arm sagged 40 mm at kp 40 and the descent could only repeat to
    # about 8. At kp 300 the pregrasp now settles to 4 mm in one go, so this is no longer the
    # binding constraint and could be tightened if anything ever needs it to be. The grip check
    # is what actually decides whether the grasp worked.
    settle_tolerance_m: 0.010
    settle_attempts: 2

    # How far off the grasp pose the descent may end and still be worth closing on. The hand takes
    # nothing wider than 75 mm and these blocks are 60, so a couple of millimetres is slack and
    # anything past that is air. Measured on a failed pick: the descent ended with the block 115 mm
    # away in the palm's frame, the fingers swept shut through nothing, and the grip check then
    # reported every finger unloaded -- a true answer to the wrong question, since the arm had
    # never arrived. Refusing here says that instead, and leaves the object untouched for the
    # retry.
    max_grasp_offset_m: 0.020

    # Where every descent starts from, back up the approach axis, with only the stretch below it
    # taken as a straight line. Not the pregrasp: the full approach is 12 to 22 cm and runs out of
    # straight line part way often enough that retrying the whole thing repeats that. 8 cm clears
    # the top of anything this hand can grip and is short enough to walk.
    reaim_clearance_m: 0.08

    # How long to let the arm stop before measuring it. MoveIt's execute() returns when the
    # controller says the trajectory is done, which is about a second before a position-only arm
    # has finished sagging into its steady-state error. Measured too early it reads a pose the arm
    # never reached, and the corrections then chase a residual that is not there.
    settle_wait_s: 0.8

    # Clears the workbench, and the exemption is restored at the end of the lift, so wherever the
    # lift finishes becomes the start state of the next collision-checked plan.
    #
    # The arm never quite gets here: position-only, it settles about 39 mm low under the load of
    # a held block, and that gap is the same 39 mm whether this is 0.20 or 0.15, so it is sag
    # rather than reach. Asked for 0.20 to leave about 160 mm of real clearance for the carry.
    lift_height_m: 0.20

    # The same standoff for a place. Smaller than the pick's on purpose: a place target is
    # already elevated by whatever it is going onto, so the same 0.22 put the preplace at 1.155 m
    # where the pregrasp that works sits at 1.090. Measured, every one of the five plans to it
    # failed in 5 ms, which is an unreachable goal rather than a search that ran out of road.
    place_approach_height_m: 0.15

    # Straight-line lift tries. One is not enough when the line is genuinely blocked: whatever
    # truncates it is usually below the hand, so the next line, started higher, gets further.
    # Retried on the Cartesian fraction alone; the 39 mm of sag is not a short line and retrying
    # it just spends every attempt.
    lift_attempts: 3

    # How far the object may end up from where it was aimed before the place is called a failure.
    # 0.08 could not tell the two outcomes apart that matter here: the box floor and the tabletop
    # beside it are 12 mm apart, and a block left on the table measured 68 mm from the aim point,
    # which passed. Sized instead to the box's 120 mm cavity, so landing outside it fails.
    place_tolerance_m: 0.05

    # The hand covers the object until it lets go, so the detector needs a frame or two before the
    # landing can be confirmed at all. Running out is a failure: not being able to see where the
    # object went is exactly the state a dropped one leaves behind.
    place_confirm_timeout_s: 4.0

    # Well under joint_limits.yaml's 0.8 rad/s cap: arm motion disturbs a standing humanoid, and
    # scaling the trajectory beats clamping joints, which bends the path.
    #
    # Halved from 0.3 because the arm does not follow what the planner draws. Measured off
    # arm_trajectory_controller's own error field, while moving: 57 mm at the hand on the median,
    # 74 mm at the 90th, 171 mm at worst, against a scene whose gaps are tens of millimetres.
    # MoveIt guarantees clearance along the trajectory, so whatever the arm lags by is clearance
    # the real link never had, and no amount of octomap or planner work can close that. Slower
    # trades cycle time for the part of the lag that is dynamic; the rest is gain, in
    # g1_description/config/lowcmd_params.yaml.
    velocity_scaling: 0.15
    planning_time_s: 10.0

    # Samples per motion, all inside planning_time_s: ValidateSolution rejects paths OMPL accepted,
    # and that rejection returns fast enough to sample again.
    planning_attempts: 5

    # Which face the fixed grasp comes in on: "top" or "front". The generator, when one is
    # running, answers this for itself and ignores both.
    #
    # Top descends onto the top face and closes across the object's width. It is what every
    # scene here was tuned against, and it is marginal on these props: the block is 60 mm across
    # and the hand takes 75, so the fingers barely span it and a grip that survives a pinned-base
    # lift has been seen to shake loose while the robot walks.
    #
    # Front comes in horizontally onto the face turned towards the robot. Same closing width, but
    # the object's long axis lies across the fingers rather than along them, so there is more of
    # it between them to hold.
    #
    # Measured head to head on the tabletop, four runs, the approach confirmed in the log each
    # time: top put the block in the bench 2 of 2, front managed 0 of 2. Front either could not
    # reach the grasp pose at all or dropped the block during the lift, and knocked it off the
    # bench doing so. It is kept because the plumbing is sound and the failure is in THIS tuning
    # of it -- the yaw is right but the grip height and the path in from the standoff are not --
    # and because a real scene will have objects that cannot be taken from above.
    grasp_approach: "top"

    grasp_rpy: [-1.5707963, 0.0, 0.0]

    # The same for a front grasp, and a separate number because it is a different wrist pose
    # rather than a tweak of the one above. Mirrors for the left arm exactly as grasp_rpy does.
    #
    # The yaw is 45 degrees because that is the only one that works, swept against IK and
    # /check_state_validity at the tabletop block, octomap contacts discounted since the descent
    # exempts the hand from the map:
    #   yaw   0: the grasp is reachable, the standoff behind it drives the arm into the torso
    #   yaw  45: both reachable and clear, at every grip height tried
    #   yaw  90: no IK at the grasp at all
    #   yaw -45, -90, 180: blocked on the shoulder, or no IK
    front_grasp_rpy: [-1.5707963, 0.0, 0.7853982]

    # A front grasp's equivalent of approach_height_m: how far back along its own approach axis
    # it stages. The axis points at the robot, so this is clearance in front of the object rather
    # than above it.
    front_approach_standoff_m: 0.18

    # Where a front grip lands, measured up from the object's base. Half of a 90 mm block, so the
    # fingers take it across the middle with equal amounts above and below.
    front_grip_height_m: 0.045

    # `grasp_source` is a launch argument, for the same reason `object_timeout_ms` is. There is
    # no fallback between the two: a pick quietly using the fixed pose would look like it worked.
    grasp_service: "/g1_grasp_engine/generate_grasps"

    # Must stay longer than the adapter's own zmq_timeout_ms (30 s in g1_graspgen_adapter.yaml):
    # give up first and a slow generator is reported silent while it is still working.
    grasp_timeout_s: 35.0

    # Candidates come back best first. Below this score they are not worth the inverse
    # kinematics call, and past this many the arm is not going to reach a better one.
    min_grasp_score: 0.5
    max_grasp_candidates: 20

    # How far from straight down a grasp may come in. Past a right angle it reaches up through
    # the table; the margin below leaves room for one across a corner.
    max_approach_tilt_deg: 75.0

    # Where the hand waits, back along the grasp's own approach axis rather than straight up: a
    # side grasp has its clear line along that axis and a ceiling above it.
    approach_standoff_m: 0.12

    # Per candidate, and there can be twenty of them, so this is a filter rather than a solve.
    ik_timeout_s: 0.05

    # The last move into a grasp is a straight line, as MoveIt's own pick pipeline does: how
    # finely it is walked, and how much must be clear before it is taken instead of planned.
    cartesian_step_m: 0.005
    cartesian_min_fraction: 0.8

    # `graspgen_to_grasp_frame_xyz_rpy` is a launch argument for the same reason: it describes
    # whichever generator is answering, and the stand-in's frame is not the real one's.

    # Settle time after /clear_octomap, before anything plans against the map again.
    #
    # The clear is not selective and the planning scene holds no collision objects at all, so it
    # takes the table and the bench with it, not just the arm's own stale voxels. Measured on the
    # tabletop world: the map is at 18 % of its old size 0.2 s after a clear, 72 % by 0.4 s and
    # peaks at 0.8 s. Planning inside that window is planning blind, which is how the arm came to
    # drive into the bench. It settles back at 72 %, and the 28 % that never returns is the stale
    # part nothing can currently see, which is the whole point of clearing.
    octomap_rebuild_wait_s: 0.8
