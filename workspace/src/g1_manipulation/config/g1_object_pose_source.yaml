# The object-pose source, loaded by g1_manipulation/launch/manipulation.launch.py.
g1_object_pose_source:
  ros__parameters:
    # object_source and publish_markers are launch arguments only: a node-named key here would
    # beat the launch override and pin them.

    # In: the frame the detector measures in, which rides on the robot. Out: fixed, so MoveIt's
    # collision objects do not move with the robot.
    source_frame_id: "camera_color_optical_frame"
    output_frame_id: "odom"
