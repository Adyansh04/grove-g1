# Walks the base into arm's reach of a measured object, and backs it out again.
# See g1_locomotion/README.md and docs/notes/m9-base-approach.md.
#
# *** THESE ARE SIM BRING-UP VALUES, NOT HARDWARE-SAFE DEFAULTS. ***
# The pulse velocities and durations encode the SIM WALKING POLICY's gait-initiation dead zone,
# the same property g1_gait_shaper.yaml exists for. The real G1's onboard controller has no such
# gap and can be commanded continuously, so on hardware this node needs a different control law,
# not different numbers -- and probably does not need to exist at all.
g1_base_approach:
  ros__parameters:
    # Remapped to /cmd_vel_approach, which g1_gait_shaper takes as its HIGH-priority input and
    # prefers over Nav2's /cmd_vel for override_timeout_s after each message. Two writers on the
    # velocity channel is what CLAUDE.md section 7 forbids; sequencing in the behaviour tree makes
    # them non-concurrent in practice, but that is a timing coincidence rather than ownership.
    cmd_vel_topic: "cmd_vel_approach"
    base_frame: "base_footprint"

    # Every one of these must clear g1_gait_shaper's engage thresholds (fwd 0.45, yaw 1.20,
    # lat 0.50) or the shaper zeroes them and this node walks nowhere while reporting that it is
    # walking. pulse_vyaw was 1.30 originally, which clears the SHAPER and not the POLICY -- the
    # policy measures "no motion at or below 0.60, steps from 1.50" -- so the first live approach
    # spent its whole budget asking for a turn that never happened.
    pulse_vx: 0.45
    pulse_vyaw: 1.50
    pulse_vy: 0.50

    # One duration per primitive, and they are NOT interchangeable. Measured, three repeats each,
    # on a settled robot in open ground:
    #
    #   forward  0.30 s -> 0.293 m, sd 0.010, and +8.2 deg of yaw every time
    #   yaw CCW  0.15 s -> +3.8 deg, and 3 mm of translation
    #   yaw CW   0.60 s -> -3.5 deg (-3.62, -3.44, -3.39), tight
    #   lateral  0.15 s -> ~0.035 m, under a degree of yaw, under a centimetre of forward
    #
    # YAW IS ASYMMETRIC, and the two directions need different durations. A 0.15 s pulse turns
    # +3.8 deg counter-clockwise and only -1.1 deg clockwise; clockwise does not reach -3.5 deg
    # until 0.60 s. Since a forward step yaws +8 deg EVERY time, every correction this skill
    # needs is in the weak direction, and the first live run spent fourteen pulses failing to
    # take out 7 degrees with a symmetric 0.15 s.
    #
    # Forward is IRREDUCIBLE. A 0.10 s pulse still produced 0.42 and 0.46 m on the trials where
    # it triggered: once the gait commits to a step sequence it takes the whole thing. That is
    # why the last approach step is taken obliquely rather than made smaller.
    #
    # Yaw and lateral are bimodal at longer durations -- either a small settle or a committed
    # step -- and 0.15 s is what keeps them in the small mode worth having.
    step_pulse_s: 0.30
    turn_pulse_ccw_s: 0.15
    turn_pulse_cw_s: 0.60
    strafe_pulse_s: 0.15

    # THESE DURATIONS ARE A STARTING POINT, NOT A CONSTANT. The gait's response depends on how
    # recently it moved, by a factor of about seven: a 0.15 s counter-clockwise pulse turns
    # 3.8 deg from a settled robot and 0.5 deg inside this loop, and three consecutive 0.30 s
    # forward steps were measured moving the robot 1 mm each. So a pulse that does nothing is
    # lengthened and tried again, and the duration resets as soon as one bites or the direction
    # changes.
    #
    # This is a closed loop, so growing the pulse cannot run away: the next iteration measures
    # what it did. The ceilings only stop it reaching for a stride the gait cannot take.
    max_turn_pulse_s: 1.20
    max_step_pulse_s: 0.80
    pulse_growth: 1.6
    # Under a degree of turn, or 5 cm of step, counts as the gait having ignored the pulse.
    stalled_turn_rad: 0.017
    stalled_step_m: 0.05

    # Hold zero while the gait finishes the stride it is already in, THEN say nothing at all for
    # a moment.
    #
    # The quiet gap is the more important of the two, and was missing for most of this skill's
    # life. Every duration in this file was measured by a probe that stopped publishing between
    # pulses; the loop published zeros continuously instead, and the same 0.60 s clockwise pulse
    # that turns 4 to 6 degrees under the probe turned 0.5 degrees in the loop. Going quiet lets
    # g1_loco_bridge's velocity gate fall idle rather than re-issue SetVelocity(0) at 5 Hz, so
    # the next pulse starts from rest.
    settle_s: 2.5
    quiet_after_s: 1.2
    cmd_rate_hz: 20.0

    # WHERE THE OBJECT HAS TO END UP, in the base frame, for the arm to reach it.
    #
    # MEASURED, by asking /compute_ik for the grasp frame at the workbench cube's own height
    # (pelvis z +0.0375) across a sweep of x, four attempts each: m9-checks/reach_sweep.py.
    # Everything from x 0.16 to 0.36 solves 4/4; 0.38 and beyond solve none.
    #
    # This replaced 0.28 with a tolerance of 0.045, which came from the one configuration the
    # pick is proven at in the manipulation scene. That was one sample mistaken for a range, and
    # it cost twice: it put the target 8 cm nearer than the arm needs, which drives the robot's
    # hips into the table edge, and it made the window a third of its real width, so the approach
    # was creeping after precision the gait does not have.
    #
    # target_y_m mirrors for the left arm, exactly as the grasp offset does.
    target_x_m: 0.280
    target_y_m: -0.220

    # Forward is the tight axis because it is the one the gait cannot resolve directly: the
    # oblique step buys about 1.8 cm of resolution near 60 degrees, so 0.045 is reachable.
    # Lateral is generous next to its own 0.035 m quantum, and residual heading error lands here
    # too.
    #
    # Heading is 8 deg, wider than it first looks it should be, for two reasons. The yaw response
    # is bimodal -- a 0.15 s pulse measured anywhere from 3 to 14 degrees depending on whether
    # the gait takes a settle or a committed step -- so a tolerance near one quantum cannot be
    # held. And heading precision matters less here than it seems: the grasp is computed in the
    # BASE frame, so what has to be right is where the object sits relative to the robot, and
    # residual heading error shows up as lateral error, which is the cheap axis to fix.
    # From a 2D grid run at the workbench with the arms tucked, at the PREGRASP height, checking
    # each IK solution against /check_state_validity (m9-checks/reach_grid.py). Only the pregrasp
    # has to be collision-free: the grasp pose sits on the table and is inside its octomap by
    # construction, which is what the descent's collision exemption exists for.
    #
    # The pregrasp band is solid across every x from 0.16 to 0.38 for y between -0.20 and -0.26,
    # and gets patchy above -0.17. So the lateral window is the tight one and the forward window
    # is not.
    #
    # The old +/-0.07 lateral is what let the approach stop with the cube at y -0.114, well into
    # the patchy region, and the pick then died on the pregrasp with GOAL_STATE_INVALID.
    # Forward is the LOOSE axis and lateral is the tight one, which is the opposite of what the
    # first single-line sweep suggested. 0.09 puts the forward window at x 0.19..0.37, all of it
    # inside the solid band; a run that stopped at 0.066 of forward error and 0.022 of lateral
    # was refused by a 0.060 forward tolerance it had no reason to be held to.
    forward_tolerance_m: 0.090
    lateral_tolerance_m: 0.040
    # LOOSE on purpose, 20 degrees. The window is judged in the base frame, which is the frame
    # the arm works in, so heading is not part of reachability at all -- it only decides which
    # way the forward drives point and roughly how the robot stands to the surface. Holding it
    # tightly bought nothing and cost most of the skill's pulses taking out a few degrees.
    heading_tolerance_rad: 0.350

    # Nearer than this and the object is under the robot's own shell. Set just below the measured
    # band's near end (0.16) so that being merely past the window leaves room for a backwards
    # creep, which is the only reverse this robot has.
    min_forward_m: 0.140

    # Take a forward step while more than this is left; creep below it. About one typical step:
    # 0.293 m from a settled robot, 0.37 to 0.51 inside the approach loop where the gait is
    # already warm from the re-aim before it.
    #
    # It is NOT an upper bound, and was, which broke the approach outright. At 0.60 the planner
    # refused to step with 0.58 m of gap left -- on the grounds that a 0.60 step might overshoot
    # -- and set about closing the whole 0.58 m at 2.5 cm a creep. It never arrived. Overshooting
    # is recoverable now (a creep runs backwards), so caution here costs far more than it saves.
    step_threshold_m: 0.32

    # How far off the working heading the FINE approach aims before strafing. A strafe there
    # advances strafe*sin(offset) and slides strafe*cos(offset): at 45 degrees that is 2.5 cm
    # forward and 2.5 cm sideways per pulse, both precise, and the slide is pointed at whichever
    # side the lateral error needs.
    #
    # This replaced an oblique FORWARD step, which does not survive contact. Closing a 12 cm
    # remainder that way needs about 75 degrees, which throws the robot half a metre sideways and
    # costs forty pulses to turn into and out of at 3.8 degrees each. Live, it oscillated across
    # the target and spent its whole budget turning.
    fine_offset_rad: 0.785

    object_timeout_ms: 1500.0

    # Generous, because the pulses are small and each carries a 2.5 s settle. A typical approach
    # is three forward steps, a couple of yaw pulses to re-aim before each, an oblique final
    # step and a few strafes -- call it 25 pulses and 70 s. max_aim_pulses bounds ONE re-aim, so
    # a heading that will not settle fails fast instead of eating the whole budget.
    max_pulses: 150
    # A 45 degree creep turn is about 13 pulses counter-clockwise and 13 clockwise once the
    # settle is long enough for each to land. 30 leaves room for the gait having a bad round
    # without letting a stuck heading eat the whole goal.
    max_aim_pulses: 30
    default_timeout_s: 900.0
