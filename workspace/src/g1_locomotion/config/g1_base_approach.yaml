# Walks the base into arm's reach of a measured object, and backs it out again.
# See g1_locomotion/README.md.
g1_base_approach:
  ros__parameters:
    # Nav2's topic too; the mission tree never runs the two together.
    cmd_vel_topic: "/cmd_vel"
    base_frame: "base_footprint"

    # Speed floors: the gait ignores commands inside its deadband, and lateral needs more than
    # forward before it tracks.
    min_speed_x_mps: 0.20
    min_speed_y_mps: 0.25

    # Ceilings, well inside what the policy tracks, since this runs next to furniture.
    max_speed_x_mps: 0.40
    max_speed_y_mps: 0.35
    max_yaw_rate_rps: 0.60

    # Proportional gains before the floors and ceilings. Yaw has no deadband and no floor.
    speed_per_m: 1.0
    yaw_rate_per_rad: 1.0

    # Reverse speed for a retreat, which backs away from a surface blind.
    retreat_speed_mps: 0.30

    # Zero held while the gait finishes its stride, before the object is re-measured.
    settle_s: 1.0
    cmd_rate_hz: 20.0

    # Where the object has to end up in the base frame. Every pick of the ball came from x 0.29 to
    # 0.32; nearer, the pregrasp has no IK. target_y_m mirrors for the left arm.
    target_x_m: 0.300
    target_y_m: -0.220

    # Objects to stand further back from: reaching over a surface to set something down sweeps
    # the wrist across its face.
    standoff_object_ids: ["brown_box"]
    standoff_target_x_m: [0.350]

    # How close each axis has to get. The robot coasts 25 to 37 mm forward and 15 to 43 mm
    # laterally after the command stops, always toward the target.
    forward_tolerance_m: 0.030
    lateral_tolerance_m: 0.040

    # Loose on purpose (20 degrees): heading only keeps the robot square to the surface.
    heading_tolerance_rad: 0.350

    # Nearer than this the object is under the robot and the tree has to re-stage through Nav2.
    min_forward_m: 0.050

    # How old an object's last sighting may be. The props stand still, and the last half metre to
    # the storage bench is blind: the hand carrying the ball covers the box.
    object_timeout_ms: 30000.0

    # How long a missing object pose or base transform is waited out, standing still.
    lookup_grace_s: 5.0

    default_timeout_s: 900.0
