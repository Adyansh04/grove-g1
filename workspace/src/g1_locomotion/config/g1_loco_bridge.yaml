# Parameters for g1_locomotion's g1_loco_bridge node. Wildcard node match so this
# file works regardless of the node's name/namespace at launch time.
/**:
  ros__parameters:
    # Vendor's own BaseClient blocks 5.0 s waiting for a response before giving up --
    # this is that same value, applied non-blockingly by sweep().
    request_timeout_s: 5.0

    # Belt-and-braces bound on LocoRequestCorrelator's pending-request map. Normal
    # operation keeps at most ~3 entries outstanding (one SetLocoMode goal, one
    # velocity re-issue, one FSM poll) thanks to supersede(); this only matters if
    # responses stop arriving faster than sweep() can time them out.
    max_pending: 16

    # SET_VELOCITY re-issue rate. Must stay > 1.0: duration (see g1_locomotion's
    # loco_payloads.hpp, kVelocityDurationS = 1.0 s) is a dead-man switch, so
    # re-issuing at or below 1 Hz would let it expire between requests.
    velocity_reissue_hz: 5.0

    # ~/cmd_vel older than this is "stale" -- VelocityGate sends exactly one
    # SetVelocity(0,0,0) and then idles rather than continuing to re-issue a
    # possibly-dead command.
    cmd_vel_timeout_ms: 500.0

    # Consecutive non-zero SetVelocity error codes before VelocityGate releases
    # authority on its own (kHeld -> kReleased) rather than continuing to retry.
    failure_streak_limit: 3

    # [vx, vy, vyaw] clamp applied to every ~/cmd_vel sample, in the bridge's own
    # (post axis_sign) frame -- m/s, m/s, rad/s.
    #
    # These sit just above the sim walking policy's measured gait-initiation
    # thresholds ([0.40, 0.50, 1.50]); below those it stands still instead of
    # stepping. The previous [0.3, 0.2, 0.5] clamped every axis BELOW its own
    # threshold, so the robot could never take a step no matter what was
    # commanded -- a clamp that conservative is not cautious, it is broken.
    # HARDWARE RE-VALIDATION: these thresholds are a property of the sim policy,
    # not of the onboard controller. Re-lower this (or override it from launch)
    # before a first hardware run, where slow-by-default is the right posture.
    max_velocity: [0.8, 0.6, 1.5]

    # [vx, vy, vyaw] sign flip applied before max_velocity clamping. The vendor's
    # own frame convention relative to geometry_msgs/Twist is undocumented -- this
    # is the calibration knob hardware bring-up will need, not a value we can
    # derive in sim.
    axis_sign: [1.0, 1.0, 1.0]
