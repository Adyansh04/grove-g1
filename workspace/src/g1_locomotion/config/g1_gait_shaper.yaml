# Reduces a planner's Twist onto the four motions this gait can actually produce: stop, drive
# straight, strafe, turn in place. See g1_locomotion/README.md and gait_shaper.hpp.
#
# *** THESE ARE SIM BRING-UP VALUES, NOT HARDWARE-SAFE DEFAULTS. ***
# The deadband they encode is a property of the SIM WALKING POLICY. The real G1's onboard MPC
# gait controller has no such dead zone, so on hardware this node is simply not launched --
# it must not be "re-tuned" for the robot. Same standing as g1_loco_bridge.yaml's max_velocity.
g1_gait_shaper:
  ros__parameters:
    # Forward speed at or above which a command is passed through; anything less becomes a stop.
    #
    # Measured on this policy: no motion at or below 0.35 m/s, steps from 0.40. 0.45 sits above
    # the step point with margin, because the threshold has NO hysteresis -- kicking above it and
    # dropping back stops the gait outright, so sitting right on the edge is the worst place to be.
    #
    # Compared SIGNED, so any negative vx becomes zero at any magnitude. Reverse measures
    # -0.247 m/s for a commanded -0.60 and exactly 0.000 for -0.40, so a planner's usual backup
    # speeds (0.025-0.15 m/s) are entirely inside the dead zone. That signed comparison is also
    # the backstop that stops a misconfigured recovery behaviour producing a reverse lurch.
    fwd_engage: 0.45

    # Reverse gets its OWN threshold, higher than forward's, rather than being refused outright.
    #
    # Measured: -0.60 yields -0.247 m/s and -0.40 yields exactly 0.000, so reverse exists but only
    # well past where a planner would ask for it. Nav2's backup speeds (0.025 to 0.15 m/s) stay
    # zeroed, which backstops against a misconfigured recovery behaviour lurching backwards. A
    # caller that deliberately commands -0.60 -- g1_base_approach backing away from a workbench,
    # because turning to walk away would sweep the arm across the table it just picked from --
    # gets through on purpose.
    rev_engage: 0.55

    # Yaw rate at or above which the command becomes a pure in-place turn.
    #
    # Measured: no motion at or below 0.60 rad/s, steps from 1.50. Deliberately below 1.50 so the
    # rotation shim's angular ramp engages a tick earlier at the 5 Hz control rate.
    yaw_engage: 1.20

    # Upper bound on the turn that gets through. Equals g1_loco_bridge.yaml's max_velocity[2],
    # so the shaper never hands the bridge something the bridge would clamp anyway.
    yaw_clamp: 1.57

    # Lateral speed at or above which the command becomes a pure strafe.
    #
    # Measured on this policy: no motion at or below 0.30 m/s, steps from 0.50, and a commanded
    # 0.5 yields 0.44. So 0.50 is the first value known to move, with no headroom above it --
    # g1_loco_bridge.yaml's max_velocity[1] is 0.5 and lat_clamp matches it, for the same reason
    # yaw_clamp matches max_velocity[2]: the shaper should never hand the bridge something the
    # bridge would clamp.
    #
    # Nav2 never reaches these: its controller commands no lateral on this robot. The only caller
    # is g1_base_approach, which strafes to null the lateral error between where an object is and
    # where the arm can reach it -- see gait_shaper.hpp.
    lat_engage: 0.50
    lat_clamp: 0.50
