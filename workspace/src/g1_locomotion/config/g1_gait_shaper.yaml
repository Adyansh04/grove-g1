# Reduces a planner's Twist onto the three motions this gait can actually produce: stop, drive
# straight, turn in place. See g1_locomotion/README.md and gait_shaper.hpp.
#
# *** THESE ARE SIM BRING-UP VALUES, NOT HARDWARE-SAFE DEFAULTS. ***
# The deadband they encode is a property of the SIM WALKING POLICY. The real G1's onboard MPC
# gait controller has no such dead zone, so on hardware this node is simply not launched --
# it must not be "re-tuned" for the robot. Same standing as g1_loco_bridge.yaml's max_velocity.
g1_gait_shaper:
  ros__parameters:
    # Forward speed at or above which a command is passed through; anything less becomes a stop.
    #
    # Measured on this policy: no motion at or below 0.35 m/s, steps from 0.40. 0.45 sits above
    # the step point with margin, because the threshold has NO hysteresis -- kicking above it and
    # dropping back stops the gait outright, so sitting right on the edge is the worst place to be.
    #
    # Compared SIGNED, so any negative vx becomes zero at any magnitude. Reverse measures
    # -0.247 m/s for a commanded -0.60 and exactly 0.000 for -0.40, so a planner's usual backup
    # speeds (0.025-0.15 m/s) are entirely inside the dead zone. That signed comparison is also
    # the backstop that stops a misconfigured recovery behaviour producing a reverse lurch.
    fwd_engage: 0.45

    # Yaw rate at or above which the command becomes a pure in-place turn.
    #
    # Measured: no motion at or below 0.60 rad/s, steps from 1.50. Deliberately below 1.50 so the
    # rotation shim's angular ramp engages a tick earlier at the 5 Hz control rate.
    yaw_engage: 1.20

    # Upper bound on the turn that gets through. Equals g1_loco_bridge.yaml's max_velocity[2],
    # so the shaper never hands the bridge something the bridge would clamp anyway.
    yaw_clamp: 1.57
