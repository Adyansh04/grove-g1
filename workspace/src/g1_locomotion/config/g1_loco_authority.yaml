# Lifecycle bracket around LocoClient velocity authority: active means the robot is
# walk-capable, inactive means authority has been handed back. See g1_locomotion/README.md.
#
# Both values below were MEASURED, not guessed -- they were the two numbers here with no
# empirical grounding at all otherwise, so they were measured before this node was written.
g1_loco_authority:
  ros__parameters:
    # The bridge's action, absolute. A parameter rather than a launch remap: remapping does not
    # reach an action client created through rclcpp_action::create_client's node-interfaces
    # overload on Humble, and the symptom is an acquire that times out blaming the bridge.
    # The status topic beside it is an ordinary subscription and does remap normally.
    set_mode_action: "/g1_loco_bridge/set_mode"

    # Per-step budget: applied independently to waiting for the action server, to STAND_UP, to
    # START, and to ~/status reporting HELD. Worst case four times this.
    #
    # Measured round-trip is 0.64-1.31 ms, because motion_service_sim answers over loopback in
    # the same container -- so the measurement does NOT set this value, and a rule like
    # "3x the max observed" would give an absurd 4 ms. 5.0 s is the floor, and it is chosen to
    # match g1_loco_bridge.yaml's own request_timeout_s: anything smaller could time out before
    # the bridge itself has given up, turning a slow response into a spurious acquire failure.
    #
    # On hardware the round trip is over a real network to a real controller. Re-measure.
    acquire_timeout_s: 5.0

    # How long after a successful START before the gait is actually responsive to cmd_vel.
    # START returns almost instantly, but the robot does not walk yet.
    #
    # Measured over 8 fresh launches: 7 eventually moved, and 6 of those clustered at
    # 1.83-1.92 s. 2.5 s is that cluster plus ~30%.
    #
    # NOT the p90, which was 6.27 s. That rule assumed one mode; the distribution has two. The
    # one 12.79 s sample is not a slower settle, it is the same nondeterminism that left 1 of 8
    # launches never walking at all -- and no sleep fixes that one. Padding every startup to
    # 6.5 s would make the common case 3.5x slower and still not cover it. That failure belongs
    # to Nav2's progress checker, which aborts the goal; see the README.
    settle_after_start_s: 2.5
