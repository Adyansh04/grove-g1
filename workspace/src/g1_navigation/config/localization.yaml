# nav2_map_server serves the committed map and AMCL owns map -> odom. Not slam_toolbox's
# localization mode, whose serialized pose graph is too large to commit (see maps/README.md).
#
# Values assume odometry:=fast_lio, which drifts; under ground_truth map -> odom sits at identity.
# Every nav2_amcl parameter is listed, defaults included; `ros2 param dump /amcl` regenerates it.
# use_sim_time is false throughout: there is no /clock on this track.
map_server:
  ros__parameters:
    use_sim_time: false
    # Set by the launch, which resolves it against the package share.
    yaml_filename: ""

amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: "map"
    odom_frame_id: "odom"
    map_topic: "map"
    first_map_only: false
    # Published by g1_state_estimation; the URDF root is pelvis.
    base_frame_id: "base_footprint"
    scan_topic: /scan

    # The robot strafes: g1_base_approach commands lateral velocity and the gait drifts sideways.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Matches the scan's own limits, so AMCL weighs exactly the beams that exist.
    laser_max_range: 25.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Below Nav2's 0.25 m / 0.2 rad, so drift is corrected in small steps, not one visible jump.
    update_min_d: 0.10
    update_min_a: 0.10

    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    save_pose_rate: 0.5
    tf_broadcast: true
    # Generous against 50 Hz odometry and 10 Hz scans; TF timing is this stack's usual failure.
    transform_tolerance: 1.0

    # The simulator spawns the robot at the map origin. Without this AMCL waits for a manual
    # 2D Pose Estimate, which a launch test cannot give it.
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "amcl"]
