# /livox/lidar (PointCloud2) -> /scan (LaserScan), for slam_toolbox.
#
# Only slam_toolbox needs this. It is a 2D scan matcher and consumes LaserScan and nothing
# else. The Nav2 costmaps take the PointCloud2 directly, which is deliberate: the height band
# below throws away everything under 0.30 m, and that is exactly the obstacle class a walking
# robot must not hit: crates, the ramp, a pallet, a step.
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: false

    # Gravity-aligned, so the height band below is absolute above the floor. The measured
    # alternative, banding in a body-attached frame, costs 13% more occupied cells and 6%
    # thicker walls while walking, because the pelvis pitches roughly 5 degrees with the gait.
    # More importantly the pelvis's own height moves (0.733-0.767 m walking, further across
    # FSM states), so a body-relative band would slide up and down the walls.
    target_frame: "base_footprint"

    # Measured on the navigation scene: this band puts a return in 360 of 360 one-degree
    # azimuth bins, keeps 6240 of 11520 points, and holds per-bin range to 0.14 cm across
    # frames. A narrow band ([0.20, 0.60]) reaches only 261 of 360 bins, because the sensor's
    # 1.9-degree elevation steps are too coarse to fill a thin slice at range.
    min_height: 0.30
    max_height: 1.50

    # Full circle at the sensor's own 1-degree azimuth resolution. Asking for finer would
    # invent bins the sweep cannot fill.
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.017453292519943295

    # range_min is the Mid360's own spec minimum, matching the simulator's sweep. The robot's
    # collision shell is not in the cloud (the sweep masks to geom group 2), so there is no
    # self-return to filter out.
    range_min: 0.1
    # The facility is 17.9 x 18.0 m, so this spans it corner to corner with margin. A shorter
    # range would reduce the radial spoke artifacts in mapped free space, since at 15 m adjacent
    # beams are 26 cm apart, but those are an appearance problem and cutting reach risks
    # real coverage gaps at the far wall. 25.0 is the value that produced a clean, complete
    # map end to end.
    range_max: 25.0

    scan_time: 0.1

    # Report a miss as +inf rather than range_max. slam_toolbox treats the two differently:
    # range_max reads as "something is there, at the edge" and would map phantom walls at the
    # scan boundary.
    use_inf: true

    # The cloud is stamped with the relay's wall clock and odometry publishes TF at 50 Hz, so
    # the newest transform can trail a cloud by up to 20 ms. 0.05 dropped occasional scans;
    # this trades at most 20 ms of transform staleness (1.2 cm at full walking speed) for
    # keeping every sweep, which matters more to a scan matcher.
    transform_tolerance: 0.1
    queue_size: 5
