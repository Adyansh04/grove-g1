# Nav2 for the G1 on the unitree_mujoco track.
#
# Adapted from nav2_bringup's params/nav2_params.yaml (Humble 1.1.20) in upstream order, so the
# two diff cleanly. smoother_server, waypoint_follower and velocity_smoother are not launched.
# use_sim_time is false throughout: there is no /clock on this track.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    # Matches AMCL. A mismatch surfaces as an intermittent TF flake rather than an error.
    transform_tolerance: 1.0
    # controller_server gets its odometry through a remap in nav2.launch.py instead.
    odom_topic: /g1_odometry_publisher/odom
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # The tree paths are set by nav2.launch.py. Never write a find-pkg-share substitution in
    # this file, even in a comment: ParameterFile(allow_substs=True) expands comments too.
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Gait start-up and the 0.15 m/s deadband make stationary spells normal, and upstream's
      # 10 s aborts healthy goals. 20 s still catches a frozen gait.
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # No approach deceleration (see FollowPath): the robot arrives at full speed and coasts,
      # so tighter tolerances never converge.
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.5
    # RotationShim around RegulatedPurePursuit instead of DWB: turn in place, then drive at one
    # speed. Linear commands under 0.15 m/s do nothing, which defeats velocity sampling.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.35        # ~20 deg. Untuned, and the first knob to try.
      forward_sampling_distance: 0.6
      rotate_to_heading_angular_vel: 1.57 # g1_controllers clamps yaw rate to 0.9 rad/s anyway
      # Not bound by ramp-don't-snap, which covers joint setpoints and blend weights: this is a
      # velocity reference to a policy that balances and places its own steps.
      max_angular_accel: 10.0
      simulate_ahead_time: 1.0

      desired_linear_vel: 0.6             # g1_controllers' max_linear_speed
      # Regulation off: every feature below slows the robot, and under 0.15 m/s it stops dead.
      min_approach_linear_velocity: 0.6
      approach_velocity_scaling_dist: 0.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      # RPP rejects this and use_rotate_to_heading both true; the gait does not reverse anyway.
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_accel: 10.0
      # Yaw tracks near 1:1, so curvature steering reaches the robot and this matters. Untuned.
      lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      # The controller's pose-transform tolerance, separate from the costmaps' 0.3.
      transform_tolerance: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      # Under one gait cycle, so a cloud never takes the pelvis tilt of the other phase of the
      # step, which at range lifts floor returns over min_obstacle_height.
      transform_tolerance: 0.3
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Wider than the standing body because the gait drifts sideways; circular because it does
      # not hold heading precisely.
      robot_radius: 0.45
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        # The column must contain the sensor (1.22 m) or VoxelLayer rejects every cloud.
        # z_voxels caps at 16, so the height comes from z_resolution: 16 x 0.125 = 2.0 m.
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        # The raw cloud, not /scan, whose 0.30 m floor cut hides low obstacles. Height limits
        # apply after the transform into the global frame, so they are gravity-aligned.
        observation_sources: lidar
        lidar:
          topic: /livox/lidar
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Clears the floor returns; at 0.0 the whole floor marks as obstacle.
          min_obstacle_height: 0.08
          # Below the ceiling and light fixtures; the robot is about 1.3 m tall.
          max_obstacle_height: 1.80
          # Above obstacle_max_range so anything marked can be cleared. Far beams are too sparse
          # to clear without spoke gaps.
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          # Attitude error times range is height error; past 3 m floor returns start crossing
          # min_obstacle_height. See the README.
          obstacle_max_range: 3.0
          # Keeps the carried object and the robot's own arms off the costmap. Anything the base
          # can hit appears beyond 0.6 m.
          obstacle_min_range: 0.6
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Same as local_costmap.
      transform_tolerance: 0.3
      use_sim_time: false
      robot_radius: 0.45
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # The observation source matches local_costmap's; see the comments there.
        observation_sources: lidar
        lidar:
          topic: /livox/lidar
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.08
          max_obstacle_height: 1.80
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.6
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.85
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    # Matches the BT's 1 Hz replan; upstream's 20.0 logs a missed-rate warning every cycle.
    expected_planner_frequency: 1.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # No backup or drive_on_heading: both reverse, which the gait does not do, and without the
    # plugins no tree can call them. assisted_teleop has no caller.
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    # Spin's own clamp; g1_controllers clamps yaw rate again at 0.9 rad/s.
    max_rotational_vel: 1.57
    min_rotational_vel: 1.2
    rotational_acc_lim: 3.2

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
