# slam_toolbox, online async, building a map of the facility.
#
# Adapted from slam_toolbox's own mapper_params_online_async.yaml. Only the entries that
# needed a G1-specific answer are commented; the rest are upstream defaults kept deliberately,
# because nothing measured on this track argues against them.
#
# Async rather than sync: the two ship byte-identical parameter files, so the choice is the
# node binary and its threading model. Sync's advantage is fidelity when the mapper cannot
# keep up with the scan rate, and it does keep up here with room to spare, since neither
# slam_toolbox nor the flatten reached the top twelve processes by CPU, against a simulator
# at 139%. Async also degrades by dropping a scan rather than by lagging TF, which is the
# safer failure on a stack where TF staleness is already a live concern.
#
# Not lifelong: that adds continuous node insertion and pruning for a facility mapped once.
# Not offline: that is for post-processing a bag.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # There is no /clock on this track: the simulator links no ROS at all. A true here gives
    # this node a clock that never advances, and the symptom is TF lookups failing elsewhere.
    use_sim_time: false

    odom_frame: odom
    map_frame: map
    # Gravity-aligned and on the ground, published by g1_state_estimation. The robot's own
    # root link (pelvis) pitches with the gait and is the wrong thing to track a 2D pose from.
    base_frame: base_footprint
    scan_topic: /scan

    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05

    # Matches the scan's own range_max. Set shorter and the far wall of the 17.9 x 18.0 m
    # facility stops being rasterised even though the beams reach it.
    min_laser_range: 0.0
    max_laser_range: 25.0

    minimum_time_interval: 0.5
    # The flatten publishes at ~9.8 Hz and TF at 50 Hz, so a scan needs a transform at most
    # 20 ms old. Upstream's 0.2 is generous enough already; keeping it avoids dropping scans
    # during a launch-time TF hiccup.
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    use_scan_matching: true
    use_scan_barycenter: true
    # At the one usable forward speed (~0.6 m/s) this is a keyframe roughly every 0.8 s. The
    # robot cannot creep, so a tighter threshold would only add nodes during turns.
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1

lifecycle_manager_slam:
  ros__parameters:
    autostart: true
    node_names: ["slam_toolbox"]
    # 0 disables the heartbeat. bond is a Nav2 server convention and slam_toolbox creates
    # none, so any non-zero value tears it back down ~4 s after activating it.
    bond_timeout: 0.0
