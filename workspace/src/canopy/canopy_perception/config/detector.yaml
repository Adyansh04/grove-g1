      # electronics
      - television
      - monitor
      - laptop
      - desktop computer
      - keyboard
      - computer mouse
      - speaker
      - printer
      - wifi router
      - phone
      - tablet
      - remote control
      - game console
      - headphones
      - projector
      - power strip
      # office
      - book
