# Hardware parameters for g1_hardware_interface/G1ArmSdkSystem.
#
# Consumed by urdf/g1_arm_sdk.urdf.xacro via xacro.load_yaml at xacro-expansion
# time. Humble ros2_control hardware plugins only receive parameters through
# <ros2_control><param> tags parsed from HardwareInfo -- controller_manager's
# own YAML never reaches the plugin -- so this file is the single source of
# truth for arm bridge tuning and the xacro just routes it into <param> tags.

# System-level tunables, common to the whole G1ArmSdkSystem component.
system:
  command_publish_rate: 100.0    # Hz; /arm_sdk publish throttle (CM update_rate runs at 200 Hz)
  blend_ramp_up_s: 2.0           # s; weight eases 0->1 over this long on activate
  blend_ramp_down_s: 2.0         # s; weight eases 1->0 over this long on a clean deactivate
  emergency_ramp_down_s: 0.5     # s; faster ramp-down on stale feedback / shutdown (must fit launch's SIGTERM window)
  max_joint_velocity_rad_s: 1.0  # rad/s; slew clamp applied to every commanded joint
  lowstate_timeout_ms: 100       # ms; /lowstate age beyond this trips the emergency ramp-down

  # The waist (motors 12-14) comes with the arms on /arm_sdk and is held, not planned: the
  # component latches its measured position when the blend engages and commands that. Unitree's
  # own arm_sdk example runs the waist at four times its arm gains (60/1.5 -> 240/6.0); ours are
  # 40/1 and 25/1, so these are 4x the shoulder pair. Stiff on purpose -- this is the joint
  # resisting two loaded arms.
  waist_kp: 160.0
  waist_kd: 4.0

# Per-joint motor index (position in the LowCmd/LowState motor array) and
# position-gain pair. Index map is G1Arm7JointIndex from unitree_ros2's
# example/src/include/g1/g1.hpp: legs 0-11, waist 12-14, left arm 15-21,
# right arm 22-28 (shoulder pitch/roll/yaw, elbow, wrist roll/pitch/yaw).
# kp/kd are Unitree's example-conservative gains -- sim-safe starting points,
# tune here, never in code.
joints:
  left_shoulder_pitch_joint:  { motor_index: 15, kp: 40, kd: 1 }
  left_shoulder_roll_joint:   { motor_index: 16, kp: 40, kd: 1 }
  left_shoulder_yaw_joint:    { motor_index: 17, kp: 40, kd: 1 }
  left_elbow_joint:           { motor_index: 18, kp: 40, kd: 1 }
  left_wrist_roll_joint:      { motor_index: 19, kp: 25, kd: 1 }
  left_wrist_pitch_joint:     { motor_index: 20, kp: 25, kd: 1 }
  left_wrist_yaw_joint:       { motor_index: 21, kp: 25, kd: 1 }
  right_shoulder_pitch_joint: { motor_index: 22, kp: 40, kd: 1 }
  right_shoulder_roll_joint:  { motor_index: 23, kp: 40, kd: 1 }
  right_shoulder_yaw_joint:   { motor_index: 24, kp: 40, kd: 1 }
  right_elbow_joint:          { motor_index: 25, kp: 40, kd: 1 }
  right_wrist_roll_joint:     { motor_index: 26, kp: 25, kd: 1 }
  right_wrist_pitch_joint:    { motor_index: 27, kp: 25, kd: 1 }
  right_wrist_yaw_joint:      { motor_index: 28, kp: 25, kd: 1 }
