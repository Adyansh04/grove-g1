<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Grove-G1"><title>Grove-G1</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .wm  { font-size: 54px; font-weight: 800; letter-spacing: .06em; }
  .sub { font-size: 14px; font-weight: 600; letter-spacing: .13em; fill: #9a8c81; }
  .acc { font-size: 17px; font-weight: 700; fill: #f59e0b; }
  .cap { font-size: 10px; font-weight: 700; letter-spacing: .14em; fill: #9a8c81; }
  .chipT { font-size: 11px; font-weight: 700; letter-spacing: .1em; fill: #f5efe9; }
  .chipS { font-size: 9px; font-weight: 600; letter-spacing: .1em; fill: #9a8c81; }

  .led { animation: led 2.4s ease-in-out infinite; }
  @keyframes led { 0%,100% { opacity: .28; } 50% { opacity: 1; } }

  .bob { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .spin { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .march { stroke-dasharray: 10 8; animation: march 0.9s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -18; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    animateTransform, animateMotion, animate { display: none; }
  }

      .pan { animation: pan 14s linear infinite; }
      @keyframes pan { from { transform: translateX(0); } to { transform: translateX(-420px); } }
      .sweep { animation: sw 2.8s ease-in-out infinite; transform-origin: 545px 246px; }
      @keyframes sw { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
      .ring { fill: none; stroke: #facc15; animation: rg 2.6s ease-out infinite; opacity: 0; }
      @keyframes rg { 0% { r: 8; opacity: .55; } 100% { r: 96; opacity: 0; } }
      .wp { animation: wp 14s linear infinite; }
      @keyframes wp { 0%,100% { opacity: .25; } 6% { opacity: 1; } }
    </style>
