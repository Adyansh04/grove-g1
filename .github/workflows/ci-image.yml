# Builds the CI image and pushes it to GHCR.
#
# Separate from ci.yml on purpose: the image takes ~15 minutes to build (unitree_sdk2,
# Livox-SDK2 and ONNX all come from source) and changes perhaps monthly, while ci.yml runs on
# every push. Rebuilding it per-PR would spend a quarter of an hour proving that a dependency
# nobody touched still compiles.
#
# GHCR storage is free and unlimited for public repositories, and so are the runner minutes.
name: CI image

on:
  push:
    paths:
      - .github/ci.Dockerfile
      - .github/workflows/ci-image.yml
  workflow_dispatch:

env:
  # Lowercase, hardcoded: GHCR rejects uppercase in a path, and the owner here is `Adyansh04`,
  # so `github.repository` cannot be used directly.
  IMAGE: ghcr.io/adyansh04/grove-g1-ci

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci.Dockerfile
          # Both tags: `latest` is what ci.yml pulls, the SHA tag makes it possible to say
          # which image a given red build actually ran against.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
