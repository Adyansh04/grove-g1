# Keeps the actions themselves current. Monthly rather than weekly: these move slowly, and a
# PR per action per week is noise that gets ignored, which is worse than not checking.
#
# Deliberately NOT covering pip or apt. Those versions are pinned inside .github/ci.Dockerfile
# and .devcontainer/Dockerfile for a reason -- clang-format's output is not stable across major
# versions, and the SDK SHAs are what the workspace is verified against. Bumping them belongs
# with a build that proves the workspace still compiles, not with a bot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ""
    labels:
      - ci
