name: ${COMPOSE_PROJECT_NAME:-ros2_project_template}

services:
  ros-dev:
    # Derived development image (distinct from BASE_IMAGE)
    image: ${DEV_IMAGE_REPO:-adyansh04/ros-dev-workspace}:${ROS_DISTRO:-jazzy}
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        # Base image from your pre-built upstream images
        BASE_IMAGE: ${BASE_IMAGE_REPO:-adyansh04/ros-dev}:${ROS_DISTRO:-jazzy}${BASE_IMAGE_TAG_SUFFIX:--latest}

    # Keep the container running and attachable
    tty: true
    stdin_open: true

    # Container name includes the ROS distro for clarity
    container_name: ${CONTAINER_PREFIX:-ros_dev}_${ROS_DISTRO:-jazzy}

    # Persistent host mounts using long (object) syntax
    volumes:
      - type: bind
        source: ./workspace
        target: /root/workspace
        read_only: false
      - type: bind
        source: ./.vscode
        target: /root/workspace/.vscode
        read_only: false

      # Repo root, mounted OUTSIDE /root/workspace on purpose. Replaces four single-file
      # binds for .clangd/.clang-format/.clang-tidy/ruff.toml, which pinned the host inode
      # (editor save-by-rename left the container reading a detached file until a recreate)
      # and, being nested inside the workspace mount, made Docker create empty root-owned
      # placeholders on the host that then shadowed the real configs. The image symlinks
      # /root/<config> here, and workspace/<config> is a committed relative symlink to the
      # repo root, so both host and container resolve the same file.
      - type: bind
        source: .
        target: /root/.host-repo
        read_only: false
      - type: bind
        source: ./data
        target: /root/data
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: false
      - type: bind
        source: ${HOME}/.ssh
        target: /root/.ssh
        read_only: true

    # Hardware, networking, and IPC settings suitable for dev workflows
    privileged: true
    network_mode: "host"
    ipc: host
    # pid: host

    # GPU support with Compose (requires Docker Compose v2.3+ and NVIDIA Container Toolkit on host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display]

    # GUI environment
    environment:
      # DDS/domain, resolved here so EVERY shell in the container sees them -- the image's own
      # ENV would be overridden silently, and /etc/profile.d only runs for login shells, so
      # `manage.sh exec` (interactive non-login) would never have picked an override up.
      # Pointing the container at a real G1 is these three in .env; see README.
      - ROS_DOMAIN_ID=${GROVE_G1_ROS_DOMAIN_ID:-1}
      - GROVE_G1_ROS_DOMAIN_ID=${GROVE_G1_ROS_DOMAIN_ID:-1}
      - CYCLONEDDS_URI=${GROVE_G1_CYCLONEDDS_URI:-file:///etc/cyclonedds/cyclonedds.xml}
      # Read by CycloneDDS itself, expanding ${GROVE_G1_ROBOT_NIC:-eth0} inside the hardware
      # profile. Inert with the loopback profile, which names `lo` outright.
      - GROVE_G1_ROBOT_NIC=${GROVE_G1_ROBOT_NIC:-eth0}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=${ROS_DISTRO:-jazzy}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/10_nvidia.json
